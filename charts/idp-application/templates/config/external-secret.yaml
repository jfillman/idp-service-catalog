{{/*
One ExternalSecret aggregating every secrets: entry into one target Secret
(app-secrets), same aggregation pattern as platform-cicd-app's own
app-secrets-external-secret.yaml (one Secret regardless of how many keys are
declared, so this file itself never needs a new entry when a workload's own
`as: env|volume|both` choice changes - only idp-application.workloadEnv/
workloadVolumeMounts/workloadVolumes in _helpers.tpl branch on that per entry;
this object's shape is the same either way).

Real fix, 2026-08-18: this used to point EVERY secret at the one shared
ClusterSecretStore (<app>-<cluster>), picking an Infisical PATH per entry
(shared/<name> vs <env>/<name>) inside that single "shared" environment - Item 8's
ORIGINAL scope, before its multi-cluster revision replaced path-based pseudo-
separation with real per-environment Infisical environments + separate
ClusterSecretStores on upper clusters. That revision shipped the new stores but
never rewired this file to use them - the per-env stores existed and were
correctly isolated (proven by hand-written ExternalSecrets during that build), but
every REAL app secret still silently flowed through the old shared-store/path
convention. Fixed here for real: on any cluster other than kind-dev, a non-`shared`
secret now targets the per-env store (<app>-<cluster>-<env>, secretsScope already
pins it to that one environment, no path prefix needed) via a per-entry
`sourceRef.storeRef` override (confirmed against ESO's real
ExternalSecretData.SourceRef/StoreSourceRef Go types - a genuine ESO feature, not
guessed) - a `shared: true` secret keeps going through the wide shared store,
override kept for symmetry/clarity even though it also happens to be this
ExternalSecret's own default. kind-dev never gets a per-env store at all (by
design - see xrds/secretstore.yaml's own header: ephemeral dev/pr-N churn would
make minting/tearing down real Infisical environments per env wasteful) - every
secret there still flows through the one shared store.

Real fix #2, found live 2026-08-18 against app-checkout-api-dev's actual rendered
ExternalSecret (SecretSyncedError, "could not get secret data from provider"):
the `shared/<name>` prefix above was still wrong even after fix #1. "shared" is
the Infisical ENVIRONMENT's own name now (InfisicalProject always creates exactly
one, named `shared` - see the operator's README), already selected by the store's
own secretsScope.environmentSlug - confirmed live via the real API that
dummy-secret-01/02 actually live at secretPath "/" (environment root), no
"shared" FOLDER exists at all. A `shared: true` secret on kind-dev now reads the
bare name, no prefix. The `<envName>/` prefix stays for non-shared secrets on
kind-dev specifically - still the only way to separate `pr-12` from `pr-13` when
they share that one Infisical environment; non-dev clusters need no prefix at all
either way, already isolated by their own dedicated per-env environment+store.

No remoteRef.property - live-verified end to end against a real Infisical instance
(idp-service-catalog/operators/infisical-secretstore-operator's own test) that
ESO's `infisical` provider treats `property` as "extract this field from a
structured/JSON secret value", not "which flat secret to read" - setting it to the
same value as the secret's own name (what this file did before) fails with
"property X does not exist in secret X" for every ordinary flat secret, which is
all Infisical secrets actually are here. `key` alone is both necessary and
sufficient.
*/}}
{{- if .Values.secrets }}
{{- $isDevCluster := eq .Values.cluster .Values.devClusterName }}
{{- $sharedStore := printf "%s-%s" .Values.appName .Values.cluster }}
{{- $envStore := printf "%s-%s-%s" .Values.appName .Values.cluster .Values.envName }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: {{ include "idp-application.namespace" . }}
  labels:
    {{- include "idp-application.labels" . | nindent 4 }}
    platform.io/subcomponent: config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ if $isDevCluster }}{{ $sharedStore }}{{ else }}{{ $envStore }}{{ end }}
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.secrets }}
    - secretKey: {{ .name }}
      {{- if and .shared (not $isDevCluster) }}
      sourceRef:
        storeRef:
          name: {{ $sharedStore }}
          kind: ClusterSecretStore
      {{- end }}
      remoteRef:
        key: {{ if and $isDevCluster (not .shared) }}{{ $.Values.envName }}/{{ end }}{{ .name }}
    {{- end }}
{{- end }}
