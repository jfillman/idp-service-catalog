{{/*
One ExternalSecret aggregating every secrets: entry into one target Secret
(app-secrets), same aggregation pattern as platform-cicd-app's own
app-secrets-external-secret.yaml (one Secret regardless of how many keys are
declared, so this file itself never needs a new entry when a workload's own
`as: env|volume|both` choice changes - only idp-application.workloadEnv/
workloadVolumeMounts/workloadVolumes in _helpers.tpl branch on that per entry;
this object's shape is the same either way).

References a ClusterSecretStore named <app>-<cluster> - §3 Item 8's resolved scope
("one SecretStore per (app, cluster) ... created by the first ApplicationEnvironment
for that pair"). This chart never creates that store itself, same "who creates a
shared thing" split already established for gitops-<app-name> (§ Item 1/2) and the
store itself (§ Item 8) - both are Bootstrap-tier, owned by ApplicationEnvironment's
Composition, not this Embedded-tier chart.

remoteRef.key picks the Infisical path per item 8's structure (`/dev/*`, `/prod/*`,
`/shared/*` sub-paths within the (app,cluster) project) - which path a given secret
reads is "controlled by that env's own ExternalSecret (remoteRef), not by the
store", implemented here via each entry's own `shared:` flag (see values.yaml).
*/}}
{{- if .Values.secrets }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secrets
  namespace: {{ include "idp-application.namespace" . }}
  labels:
    {{- include "idp-application.labels" . | nindent 4 }}
    platform.io/subcomponent: config
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.appName }}-{{ .Values.cluster }}
    kind: ClusterSecretStore
  target:
    name: app-secrets
    creationPolicy: Owner
  data:
    {{- range .Values.secrets }}
    - secretKey: {{ .name }}
      remoteRef:
        key: {{ if .shared }}shared{{ else }}{{ $.Values.envName }}{{ end }}/{{ .name }}
        property: {{ .name }}
    {{- end }}
{{- end }}
