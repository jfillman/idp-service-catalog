{{/*
AI-triage diagnosis notifications (2026-08-19) - separate from app-secrets/
external-secret.yaml above deliberately: this Secret is consumed by the diagnosis
Job function-rollout-watcher composes, not by this chart's own workload container,
so it has no business flowing through workloadEnv/workloadVolumeMounts or the
per-entry as: env|volume|both machinery `secrets:` entries use - it's always exactly
one key, always a secretKeyRef, never mounted as a file.

Always the SHARED store (same one `secrets:` entries opt into via `shared: true` -
see values.yaml's own comment on that field) regardless of cluster/env - a Slack
webhook is an app-wide credential, not one that should vary staging vs. prod, and
every app already has this store (created before any per-env store, see
xrds/secretstore.yaml). No kind-dev branch needed either, unlike external-secret.yaml
above - the shared store's own key naming has no <env>/ prefix regardless of cluster,
confirmed against that file's own "Real fix #2" header note (the <envName>/ prefix
only applies to a kind-dev secrets: entry that ISN'T shared - this one always is).
*/}}
{{- if .Values.notifications.slack.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notify-secrets
  namespace: {{ include "idp-application.namespace" . }}
  labels:
    {{- include "idp-application.labels" . | nindent 4 }}
    platform.io/subcomponent: notify
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ printf "%s-%s" .Values.appName .Values.cluster }}
    kind: ClusterSecretStore
  target:
    name: notify-secrets
    creationPolicy: Owner
  data:
    - secretKey: slack-webhook-url
      remoteRef:
        key: slack-webhook-url
{{- end }}
