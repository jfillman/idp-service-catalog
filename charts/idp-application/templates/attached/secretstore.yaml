{{/*
Always-on, not a components:/slos: entry - same treatment as networkPolicy/
ServiceMonitor (idp/docs/service-catalog-design.md Item 8: "auto-provisioned...
never developer-selected"). Renders the SecretStore XRD's "shared" mode
unconditionally - every env release for this (app, cluster) pair redundantly
re-asserts the SAME object (namespace+name both fixed, independent of which env
this particular release is) - same idempotent-redundant-write convention this
catalog already uses for exactly this "N sibling releases, one shared resource"
shape (applicationenvironment's own cluster-app-yaml.yaml). Plus, on any cluster
OTHER than kind-dev, this env's own per-env-mode SecretStore XR too - real,
namespace-narrowed isolation, one per ApplicationEnvironment.

Lives in a DEDICATED namespace (app-<appName>-secrets), not this release's own
namespace (idp-application.namespace) - deliberate, not incidental: the "shared" XR
must be the SAME k8s object across every env release for this (app, cluster) pair,
which only works if every release creates it at the SAME namespace+name.
Rendering it into each env's own (different) namespace would silently create N
separate objects instead of one shared one - a real correctness bug, not a style
choice. The Namespace itself is rendered here too, redundantly and safely
(Namespace is cluster-scoped/globally unique - no ownership conflict from N
releases each "creating" the same one) - already whitelisted on this app's
AppProject (clusterResourceWhitelist: Namespace, tenant-appprojects/chart/
templates/appproject.yaml), and its wildcard destination (app-<appName>-*)
already covers this dedicated namespace too.

kind-dev check is a plain string comparison, not a values field/toggle - same
reasoning as the SecretStore Composition's own authMethod branch (see that
Composition's infisicalproject.yaml header comment): which cluster hosts Infisical
is a static topology fact, not something a developer or a per-release value
should control.

Every computed name below is explicitly quoted (`| quote`), not left as a bare
templated scalar - a real `helm lint` failure caught live with this chart's own
all-empty default values.yaml: appName/cluster both "" makes
`{{ .Values.appName }}-{{ .Values.cluster }}` render as a lone "-", which YAML
parses as an ambiguous block-sequence indicator in scalar position ("block
sequence entries are not allowed in this context"), not as the plain string "-".
Quoting sidesteps the ambiguity regardless of what the computed value actually is.
*/}}
{{- $secretsNamespace := printf "app-%s-secrets" .Values.appName }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $secretsNamespace | quote }}
  labels:
    {{- include "idp-application.labels" . | nindent 4 }}
---
apiVersion: catalog.idp.io/v1alpha1
kind: SecretStore
metadata:
  name: {{ printf "%s-%s" .Values.appName .Values.cluster | quote }}
  namespace: {{ $secretsNamespace }}
  labels:
    {{- include "idp-application.labels" . | nindent 4 }}
    platform.io/subcomponent: attached-secretstore
spec:
  appRef:
    name: {{ .Values.appName }}
  cluster: {{ .Values.cluster }}
{{- if ne .Values.cluster "kind-dev" }}
---
apiVersion: catalog.idp.io/v1alpha1
kind: SecretStore
metadata:
  name: {{ printf "%s-%s-%s" .Values.appName .Values.cluster .Values.envName | quote }}
  namespace: {{ $secretsNamespace }}
  labels:
    {{- include "idp-application.labels" . | nindent 4 }}
    platform.io/subcomponent: attached-secretstore-env
spec:
  appRef:
    name: {{ .Values.appName }}
  cluster: {{ .Values.cluster }}
  environmentSlug: {{ .Values.envName }}
{{- end }}
