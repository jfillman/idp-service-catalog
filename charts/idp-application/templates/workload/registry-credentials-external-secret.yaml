{{/*
Optional (registryCredentials.enabled, off by default - see values.yaml's own
comment for why) private-registry pull secret, synced from the same shared
platform-secret-store ClusterSecretStore/registry-credentials key
platform-cicd-app's own registry-credentials-external-secret.yaml already uses.
ClusterSecretStore is cluster-scoped, so this works regardless of which ArgoCD
instance/namespace this release lands in - no new plumbing needed on the ESO/backend
side, just a second consumer of the same store.
*/}}
{{- if .Values.registryCredentials.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-credentials
  namespace: {{ include "idp-application.namespace" . }}
  labels:
    {{- include "idp-application.labels" . | nindent 4 }}
    platform.io/subcomponent: workload
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.registryCredentials.secretStore.name }}
    kind: {{ .Values.registryCredentials.secretStore.kind }}
  target:
    name: registry-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  dataFrom:
    - extract:
        key: {{ .Values.registryCredentials.remoteKey }}
{{- end }}
