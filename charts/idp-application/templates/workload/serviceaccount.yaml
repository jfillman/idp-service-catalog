{{/*
Dedicated per-app ServiceAccount, referenced by every pod this chart renders
(Rollout/Job/CronJob) via idp-application.serviceAccountName - not the namespace's
implicit `default` SA. Added deliberately before any real deployment exists: it's
the anchor point for scoped RBAC, private-registry pulls, and a future cloud
workload-identity annotation, none of which retrofit cleanly onto pods that were
already running as `default`.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "idp-application.serviceAccountName" . }}
  namespace: {{ include "idp-application.namespace" . }}
  labels:
    {{- include "idp-application.labels" . | nindent 4 }}
    platform.io/subcomponent: workload
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- $pullSecrets := .Values.serviceAccount.imagePullSecrets }}
{{- if .Values.registryCredentials.enabled }}
{{- $pullSecrets = append $pullSecrets (dict "name" "registry-credentials") }}
{{- end }}
{{- with $pullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
