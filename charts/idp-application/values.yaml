# idp-application default values.
#
# This file documents the full schema from idp/docs/service-catalog-design.md §3.
# A real gitops-<app-name>/<cluster>/<env>/values.yaml overrides the fields below;
# it does not need to repeat ones it's happy leaving at these defaults.
#
# A handful of fields here are NOT in §3's schema block verbatim - they were needed
# to actually implement it, and are called out individually below with why. None of
# them contradict §3; they fill gaps §3 explicitly left to "chart implementation
# itself deferred to a later session." A second batch (serviceAccount, cronJobs,
# jobs, serviceMonitor, extraManifests) was added 2026-08-13 in a deliberate v1
# resource-coverage pass, once the base chart was already built and fixture-tested -
# same reasoning, also called out individually below. A third batch, same day: real
# gaps found in code review (configMaps: could only be volume-mounted, never
# envFrom'd; secrets: could only be an env var, never mounted; configMaps: could
# only be chart-owned, never reference one created externally, e.g. by a Kustomize
# configMapGenerator) - both lists gained an `as: env|volume|both` field, and
# configMaps: gained `existingConfigMap:` as an alternative to `data:`.

# --- Identity ---------------------------------------------------------------

appName: ""
appType: app # app | infra - naming-conventions.md's existing distinction (§3, "Components")

# NOT in §3's schema block. §3's "Linking mechanism" says the chart "stamps
# spec.environmentRef: {name: <app>-<cluster>-<env>} ... from its own release
# context" - but a Helm release's context (Release.Name/Namespace) has no
# structural link back to which cluster/env it is. Since every other Bootstrap-tier
# XR in this design (ApplicationEnvironment) is scoped one-per-(app,cluster,env) and
# commits directly into <cluster>/<env>/values.yaml (§ Item 3), the natural source
# for these two values is the Composition that commits this very file - it already
# knows both. Added as plain top-level fields (matching appName/appType's own flat
# style, not a nested platformIdentity block like platform-cicd-app's separate
# platform-identity.yaml - this chart has no equivalent split-file convention).
#
# Named `envName`, not `env` - §3's schema already uses the top-level key `env` for
# the Embedded-tier container env-var list (`env: [{name: FOO, value: bar}]`); a
# same-named field here would silently collide with it in one flat values map.
cluster: ""
envName: ""

# NOT in §3's schema - the chart's own "is this the dev cluster" test (secretsScope
# below, templates/config/external-secret.yaml) used to compare `cluster` against
# the literal "kind-dev" directly. Pulled out as its own value so the chart doesn't
# hardcode a specific cluster's name - a real gitops-<app-name>/<cluster>/<env>/
# values.yaml only needs to override this if its fleet's dev cluster is ever named
# something other than "kind-dev" (matches this catalog's existing single-dev-
# cluster assumption - see xrds/secretstore.yaml).
devClusterName: kind-dev

# NOT in the schema doc - platform-cicd-specific plumbing (idp-service-catalog is
# not the only writer of this file: idp-service-catalog's own ApplicationEnvironment
# composition bootstraps a values.yaml with this null/absent, and platform-cicd's
# open-release-pr.yaml Task patches this whole block in - see platform-cicd/docs/
# multi-cluster.md). Null by default - an env bootstrapped but never released
# through platform-cicd (or one whose upper env isn't cluster-mapped) has no such
# block and renders none of templates/release-tracking/'s resources.
#
# When present, this chart renders two ArgoCD sync-hook Jobs (PostSync/SyncFail -
# see templates/release-tracking/hooks.yaml) that report the confirmed outcome of
# THIS sync back to platform-cicd's dev-cluster relay over HTTP with a per-app
# shared secret - relocated here 2026-08-17 from platform-cicd's own now-retired
# per-release GitOps writer, specifically so it renders as part of the SAME
# Application idp's tenant-onboarding ApplicationSet already owns (a second writer
# would only race it - see platform-cicd/docs/multi-cluster.md's 2026-08-16 note).
# This is still the only thing that ever crosses from this (upper) cluster back to
# the dev cluster - a hook Job pushing over HTTP once ArgoCD confirms success/
# failure, never a live API call in the other direction.
#
# Every field here is opaque to this chart - platform-cicd resolves/generates all
# of it (relayUrl from its own cluster-registry ConfigMap, chainId/flowStartTime/
# prCreatedAt from the release Pipeline's own tracing/PR-creation results) and
# writes the whole block in the SAME commit as the rollout.image.* patch above, so
# it's always current for whichever release is actually being synced.
releaseTracking: null
# relayUrl: http://10.89.0.2:30880/outcome/kind-prod  # platform-cicd's argocd-outcome-relay
# cluster: kind-prod                      # must match the relayUrl's own /outcome/<cluster>
#                                          # suffix - the hook script embeds this into the
#                                          # CDEvent it builds, and argocd-outcome-relay
#                                          # checks it against what the shared secret
#                                          # actually authenticated as.
# appNamespace: app-checkout-api-cicd     # the APP's platform-cicd namespace (dev cluster) -
#                                          # NOT this release's own namespace (that's
#                                          # POD_NAMESPACE, read live by the hook via the
#                                          # downward API) - see the Trigger this feeds,
#                                          # platform-cicd's release-outcome-trigger.yaml,
#                                          # which matches on this field.
# gitUrl: ""
# gitRevision: ""
# flowStartTime: ""
# chainId: ""
# prUrl: ""
# prCreatedAt: ""
# configJsonB64: ""

# NOT in §3's schema block - added 2026-08-13 when the chart was built, per a v1
# resource-coverage pass. Without this, every workload (Rollout/Job/CronJob below)
# silently ran as the namespace's `default` ServiceAccount - fine until the first
# real need for scoped RBAC, a private-registry pull, or a cloud workload-identity
# binding (IRSA-equivalent), all of which anchor to a ServiceAccount *name*. Adding
# this after real deployments exist means a name change every caller has to follow;
# adding it now, with a name that's already the deterministic `appName` default,
# means it never has to change even when one of those needs shows up later.
serviceAccount:
  create: true
  name: "" # defaults to appName
  annotations: {} # escape hatch - e.g. a cloud workload-identity annotation
  imagePullSecrets: []
  # [{name: <existing-secret-name>}] - attached to the ServiceAccount once, inherited
  # by every pod (Rollout/Job/CronJob) via serviceAccountName, rather than repeating
  # imagePullSecrets on each pod spec separately. Merged with the always-on
  # registry-credentials Secret (see serviceaccount.yaml), so an app can list
  # additional pre-existing pull secrets here alongside it.

# This cluster's own platform-cicd Infisical-backed ClusterSecretStore
# (platform-cicd-control-plane's own on kind-dev; hand-authored the same way on every
# upper cluster - see docs/admin/secrets-management.md). Used by
# release-tracking/relay-token-external-secret.yaml. registry-credentials used to be
# an opt-in ExternalSecret this chart rendered per app from this same store - it's now
# disseminated automatically to every namespace via a ClusterExternalSecret
# platform-cicd's control-plane chart renders, so this chart no longer needs its own
# registry-credentials template (see serviceaccount.yaml, which now unconditionally
# references that Secret's name).
platformSecretStore:
  name: platform-secret-store
  kind: ClusterSecretStore

# --- Embedded: workload (Argo Rollout) --------------------------------------
#
# Omit `rollout` entirely (set to null) for an infra-type release with no custom
# workload - e.g. a standalone component-only env (§3 "Open design question",
# resolved in this implementation as "optional in the same chart", per the doc's
# own stated leaning and Item 7's "if yes (recommended, for mechanism reuse)").
rollout:
  image:
    repository: ""
    tag: ""
  replicas: 2
  resources: {}
  strategy: canary # canary | blueGreen - platform default steps used unless rollout.steps is set
  steps: [] # escape hatch for a custom canary/blueGreen step sequence; platform default used when empty
    # (§3 "Still open" item 3 - the platform default step sequence itself isn't designed
    # yet, so this chart ships no default steps of its own yet - see chart README)
  canaryAnalysis: {} # NOT in §3's schema - real gap found live migrating widget-api
    # off the ai-rollout prototype (2026-08-13): strategy.canary.analysis (continuous
    # background analysis against an AnalysisTemplate, run alongside every step - a
    # SIBLING field to steps, not nested inside it) has no curated shape here, only
    # this raw passthrough, same idiom as `steps` itself. Typical shape:
    # {templates: [{templateName: <name>}], args: [{name: canary-hash, valueFrom:
    # {podTemplateHashValue: Latest}}], startingStep: 1} - templateName references
    # one of this release's own analysisTemplates: entries (or a platform-curated
    # ClusterAnalysisTemplate). Only rendered when canary strategy is active AND this
    # is non-empty - blueGreen has no analysis field at this level.

  # Curated, safe-default escape hatches - each toYaml'd straight into the main
  # container / pod template when set.
  command: []
  args: []
  ports:
    - name: http
      containerPort: 8080
  livenessProbe: {}
  readinessProbe: {}
  podSecurityContext: {}
  containerSecurityContext: {}
  extraContainers: []
  podSpec: {} # raw map, deep-merged (mergeOverwrite) onto .spec.template.spec last -
              # NOT for containers[0] (use the curated fields above) or additional
              # containers (use extraContainers) - see §3's own warning, quoted in
              # the rollout template's header comment.

# Embedded - app-specific custom AnalysisTemplates (ClusterAnalysisTemplate covers
# the shared/golden-path case, per §3 "Argo Rollouts as the default deployment
# resource" - not rendered by this chart, referenced by name from rollout.steps).
analysisTemplates: []
# - name: checkout-conversion-rate
#   args: [] # NOT in §3's schema - real gap found live migrating widget-api
#            # (2026-08-13). Required whenever a metric's query references
#            # `{{args.<name>}}` (e.g. the canary-hash Argo Rollouts itself
#            # supplies via rollout.canaryAnalysis.args/steps[].analysis.args) -
#            # Argo Rollouts needs the arg NAME declared here, on the template
#            # itself, before it'll resolve a value supplied elsewhere. Just
#            # `[{name: canary-hash}]` - no valueFrom/value here, that part comes
#            # from whichever Rollout step or canaryAnalysis block references
#            # this template.
#   metrics: []

env: [] # [{name: FOO, value: bar}] - Embedded

configMaps: [] # Embedded - see "Rendering mechanism" in §3
# - name: app-settings
#   as: volume            # NOT in §3's schema - added 2026-08-13, second resource-
#                          # coverage pass. env | volume | both (default: volume,
#                          # §3's original unconditional behavior, unchanged). env
#                          # renders one `envFrom: [{configMapRef: ...}]` - every key
#                          # in `data:` becomes an env var verbatim (no per-key
#                          # renaming - use plain top-level `env:` for that).
#   mountPath: /config/app-settings # only used when `as` includes volume - defaults
#                                    # to /config/<name>. Mirrors the `mountPath`
#                                    # field §3's own `volumes:` entries already carry.
#   data: {app-config.yaml: "..."}  # EITHER this (this chart renders + owns the
#                                    # ConfigMap)...
#   existingConfigMap: ""           # ...OR this (mutually exclusive with `data:` -
#                                    # exactly one required) - references a ConfigMap
#                                    # already created outside this chart, e.g. a
#                                    # Kustomize configMapGenerator with
#                                    # disableNameSuffixHash: true (a fixed, known
#                                    # name - a hash-suffixed name would need an
#                                    # external process keeping this field in sync on
#                                    # every regeneration, not solved here). The
#                                    # chart never renders a ConfigMap object for
#                                    # this entry, only references the given name.

secrets: [] # Embedded - same ExternalSecret/ClusterSecretStore mechanism platform-cicd
            # already built (charts/platform-cicd-app/templates/secrets/), aggregated
            # into one target Secret (app-secrets) consumed by the main container.
# - name: db-password   # secretKey in the rendered Secret AND the Infisical property
#                        # name read from the store (backend property == name, same
#                        # as platform-cicd's default-to-name behavior)
#   as: env               # NOT in §3's schema - added 2026-08-13, second resource-
#                          # coverage pass. env | volume | both (default: env, §3's
#                          # original unconditional behavior, unchanged). volume
#                          # mode does NOT create a separate Secret/volume per entry -
#                          # every `as: volume`/`both` entry shares ONE `app-secrets`
#                          # Secret volume, each mounted at its own exact file path
#                          # via `subPath: <name>` (the standard mechanism for
#                          # projecting one key from a Secret without a volume per key).
#   key: DB_PASSWORD     # env var name (only used when `as` includes env) - NOT the
#                        # same use of `key` as platform-cicd's ExternalSecret -
#                        # there `key` overrides the backend property; here it's the
#                        # env var name exposed to the container (defaults to `name`,
#                        # uppercased, when omitted). Needed because this chart, unlike
#                        # platform-cicd's, actually runs a workload that consumes the
#                        # secret as an env var, not just stages a Secret for a Task to
#                        # mount.
#   mountPath: /etc/tls/tls.crt # only used when `as` includes volume - the exact
#                                # file path this one key is projected to (NOT a
#                                # directory, unlike configMaps' mountPath - each
#                                # secrets: entry is exactly one key). Defaults to
#                                # /secrets/<name> when omitted.
#   shared: false        # NOT in §3's schema. On any cluster other than kind-dev:
#                         # false (default) reads from this env's own, isolated
#                         # Infisical environment/ClusterSecretStore (real isolation -
#                         # see xrds/secretstore.yaml); true reads from the wide
#                         # shared one instead, for values genuinely meant to be
#                         # reused across an app's envs on this cluster. On kind-dev,
#                         # there's no per-env store at all (ephemeral dev/pr-N churn
#                         # makes real per-env Infisical environments wasteful there) -
#                         # both cases read the one shared store, separated by an
#                         # Infisical PATH prefix instead (shared/<name> vs
#                         # <envName>/<name>).

notifications: # AI-triage diagnosis notifications (2026-08-19) - deliberately the same
  # shape as platform-cicd's own cicd.yaml notifications.slack.{enabled,channel}
  # (see that project's docs/archive/2026-08-18-pre-refactor/notifications.md), not a
  # new convention. Threaded into the RolloutWatch XR this chart already renders
  # unconditionally (attached/rolloutwatch.yaml) - function-rollout-watcher's
  # diagnosis Job reads it, see that function's own README for the full mechanism.
  # Distinct from `secrets:` above - enabling this alone is enough, no separate
  # secrets: entry needed. The actual webhook URL is never a values.yaml field (never
  # committed to git) - enabling this renders a dedicated ExternalSecret
  # (config/notify-external-secret.yaml) pulling `slack-webhook-url` from THIS APP'S
  # OWN Infisical `shared` environment (same `shared: true` store convention
  # `secrets:` entries already use - see that field's own comment above; a webhook
  # is an app-wide credential, not one that should vary staging vs. prod). A real
  # value must be populated there before enabling this, or the diagnosis Job's own
  # notify step just logs a skip (see notify.py) rather than failing the diagnosis.
  slack:
    enabled: false
    channel: "" # e.g. "#your-channel" - optional, only takes effect if the Slack
                # workspace's webhook app allows overriding its own configured
                # default channel; harmlessly ignored otherwise.

volumes: [] # Embedded - PVC support. Same list-of-objects + range-loop pattern as
            # configMaps, per §3's 2026-08-13 revision.
# - name: uploads
#   size: 10Gi
#   storageClassName: standard   # omit for cluster default
#   accessModes: [ReadWriteOnce] # default if omitted
#   mountPath: /data/uploads

# NOT in §3's schema - added 2026-08-13, same v1 resource-coverage pass as
# serviceAccount above. Both share `env`/`secrets`/`configMaps`/`volumes` with the
# main container automatically (same app, same namespace, same config - no opt-in
# needed, matching this schema's existing "no orphan state" instinct from §
# "Dependency ordering"). If an entry omits `image`, it defaults to `rollout.image`
# - set explicitly (`fail`s otherwise) when `rollout:` isn't set at all.
cronJobs: [] # scheduled batch tasks (nightly cleanup, report generation, ...)
# - name: nightly-cleanup
#   schedule: "0 2 * * *"
#   image: {repository: ..., tag: ...}  # optional, defaults to rollout.image
#   command: []
#   args: []
#   resources: {}
#   containerSecurityContext: {}
#   concurrencyPolicy: Forbid           # Forbid | Allow | Replace
#   suspend: false
#   successfulJobsHistoryLimit: 3
#   failedJobsHistoryLimit: 1
#   backoffLimit: 3

jobs: [] # one-off batch tasks - the common "run a DB migration before the new
         # Rollout comes up" pattern. Same image/env/secrets/configMaps/volumes
         # defaulting as cronJobs above.
# - name: db-migrate
#   image: {}                # optional, defaults to rollout.image
#   command: []
#   args: []
#   resources: {}
#   containerSecurityContext: {}
#   backoffLimit: 3
#   hook: true                # true (default): a real Helm pre-install/pre-upgrade
#                              # hook - deleted and recreated on every release
#                              # (helm.sh/hook-delete-policy: before-hook-creation,
#                              # hook-succeeded), so it always re-runs without a name
#                              # change. false: a plain, persistent Job object -
#                              # rerunning it later is on the developer (new name, or
#                              # manual delete), same as vanilla Job semantics.

autoscaling:
  enabled: false
  min: 2
  max: 10
  targetCPUPercent: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1 # NOT in §3's schema (only {enabled: false} shown) - a PDB needs
                   # either minAvailable or maxUnavailable to mean anything; defaults
                   # to the conservative "always keep at least 1" rather than inventing
                   # a percentage. maxUnavailable below is the alternative, mutually
                   # exclusive with minAvailable - set at most one.
  maxUnavailable: null

ingress:
  enabled: false
  host: ""
  path: / # NOT in §3's schema - needed for a real Ingress rule; / is the sane default.
  pathType: Prefix
  annotations: {}
  tls: false # NOT in §3's schema - whether to request a cert-manager-issued TLS cert
             # for `host` (idp-cluster-baseline installs cert-manager per gitops-strategy.md
             # §"10-crds-operators"). Off by default since not every env needs it.
  tlsSecretName: "" # defaults to "<release-name>-tls" when tls: true and this is empty

# NOT in §3's schema - added 2026-08-13. kube-prometheus-stack is already installed
# cluster-side (idp_session_phase2_holmesgpt, namespace `observability`), so this is
# near-zero-cost: every app gets Prometheus-scraped from its own declared
# rollout.ports without hand-authoring a ServiceMonitor per app.
serviceMonitor:
  enabled: true
  path: /metrics
  port: "" # defaults to the first rollout.ports entry's name
  interval: 30s
  additionalLabels: {} # escape hatch - many kube-prometheus-stack installs require a
                        # specific label (e.g. `release: <helm-release-name>`) for
                        # their own Prometheus CR's serviceMonitorSelector to pick
                        # this object up at all. Confirmed 2026-08-13 that this
                        # specific gitops-cluster-dev install does NOT need it -
                        # `serviceMonitorSelectorNilUsesHelmValues: false` (set so the
                        # OTel Collector's own ServiceMonitor, unlabeled, gets
                        # discovered too) leaves `Prometheus.spec.serviceMonitorSelector`
                        # empty (`{}`) - matches every ServiceMonitor cluster-wide,
                        # confirmed live (widget-api's own ServiceMonitor was scraped
                        # with no additionalLabels set at all). A DIFFERENT
                        # kube-prometheus-stack install using the chart's own default
                        # (`serviceMonitorSelectorNilUsesHelmValues: true`) would still
                        # need `release: <that install's release name>` here - kept as
                        # a real escape hatch, not removed, for that case.

networkPolicy:
  enabled: true
  allowIngressFromIngressController: true
  # NOT in §3's schema - §3 says "deny cross-namespace ingress except from the
  # ingress controller" but never named which namespace/labels identify it. Was an
  # unconfirmed `ingress-nginx` placeholder guess until 2026-08-13, when
  # gitops-cluster-dev/10-crds-operators/contour/ was actually built and
  # live-verified on kind-dev - the cluster's real ingress controller is Contour
  # (namespace `projectcontour`), not ingress-nginx. Parameterized rather than
  # hardcoded regardless, since a different cluster could still run something else.
  ingressControllerNamespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: projectcontour

  # NOT in §3's schema - added 2026-08-13. The raw escape hatch below
  # (extraIngressRules/extraEgressRules) requires knowing the actual K8s
  # NetworkPolicyPeer/NetworkPolicyPort shape (nested podSelector/
  # namespaceSelector/ipBlock, ports as {protocol, port} objects) - real, but
  # not simple for the overwhelmingly common case of "let this other namespace/
  # CIDR reach me on this port". allowIngressFrom/allowEgressTo cover that case
  # with a flat shape; each entry becomes its own self-contained ingress/egress
  # rule (K8s ORs separate rules together, so entries never interact with each
  # other or with the default same-namespace/ingress-controller rule above).
  allowIngressFrom: []
  # - namespace: app-payments-prod  # matches every pod in this namespace, via the
  #                                  # auto-populated kubernetes.io/metadata.name
  #                                  # label - same mechanism already used for
  #                                  # ingressControllerNamespaceSelector above.
  #   podLabels: {app: worker}      # optional - ANDed with namespace: (a real K8s
  #                                  # NetworkPolicyPeer can combine both selectors
  #                                  # on one peer), further restricts to pods
  #                                  # carrying these labels within that namespace.
  #   ports: [8080, 9090]           # optional - bare port numbers, TCP assumed
  #                                  # (the overwhelming common case); omit for
  #                                  # "all ports". Need UDP/SCTP or multiple ORed
  #                                  # peers in one rule? Use extraIngressRules
  #                                  # instead - not reinvented here.
  # - cidr: 10.0.0.0/8              # an external peer instead of namespace/
  #                                  # podLabels - mutually exclusive with both,
  #                                  # fails fast if an entry sets more than one
  #                                  # peer kind (idp-application.networkPolicyPeer).
  #   ports: [5432]
  allowEgressTo: [] # same shape as allowIngressFrom

  extraIngressRules: []
  extraEgressRules: []

components: [] # Attached - see "Rendering mechanism" in §3
# - type: redis
#   name: cache
#   spec: {size: small}

slos: [] # Attached - rendered into the `SLO` XRD (idp-service-catalog/xrds/slo.yaml),
         # which wraps Sloth (sloth.dev) - no window/burn-rate fields here, Sloth
         # computes the full canonical multi-window-multi-burn-rate pattern itself
         # from just `objective`. Compliance window is a cluster-wide default
         # (sloth.defaultSloPeriod, see gitops-cluster-dev/10-crds-operators/sloth/),
         # not a per-SLO setting.
# - name: availability
#   service: checkout-api        # PromQL label-matcher value - required
#   objective: 99.9
#   indicator:
#     type: availability           # or: latency
#     metric: http_requests_total
#     totalFilter: 'service="checkout-api"'
#     errorFilter: 'code=~"5.."'   # required when type: availability
#     # latencyThreshold: "0.3"    # required when type: latency, instead of errorFilter

# NOT in §3's schema. The generic components:/slos: range loop (§3 "Rendering
# mechanism") needs a type -> {kind, apiVersion} lookup table, and the doc's own v1
# catalog table (Redis/OAuthServer/Database/Queue/SLO) doesn't fix an actual XRD
# API group yet - none of these XRDs are built (idp-service-catalog/README.md:
# "xrds/ ... don't exist yet"). catalog.idp.io/v1alpha1 is this chart's own
# placeholder pending that group being confirmed when the XRDs are actually
# authored - update here (not in every template) when it is.
attachedResourceApiVersion: catalog.idp.io/v1alpha1
componentKinds:
  redis: Redis
  oauth-server: OAuthServer
  database: Database
  queue: Queue

# NOT in §3's schema - added 2026-08-13, the deliberate last-resort escape hatch: a
# raw list of arbitrary K8s objects, rendered as-is, no labels stamped (the chart
# doesn't know their shape well enough to safely inject anything). Same pattern
# idp-cluster-baseline already uses (gitops-strategy.md §8's extraManifests:) - the
# point is that a future one-off need (some CRD nobody anticipated) never requires
# touching this chart's templates again, only this values list.
extraManifests: []
