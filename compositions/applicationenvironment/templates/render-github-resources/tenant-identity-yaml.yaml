# Commits tenants/<appName>/<env>/identity.yaml into that cluster's own
# gitops-cluster-<cluster>-tenants - read by that repo's tenant-onboarding
# ApplicationSet (git generator over tenants/*/*/identity.yaml) to render the real
# deployment Application via idp-application. Matches
# gitops-cluster-dev-tenants/README.md's own documented identity.yaml shape exactly
# (appName/gitopsRepoUrl/githubOwner/env) - deliberately duplicating the sibling
# per-app tenants/<appName>/identity.yaml's own gitopsRepoUrl/githubOwner rather than
# requiring the ApplicationSet to join two files (same reasoning that README already
# gives). Different file, different consumer, DELIBERATELY not the same nested
# platformIdentity: shape that sibling file uses (see cluster-identity-yaml.yaml's own
# header, and nodejsapplication's cicd-identity-yaml.yaml, for why THAT file's schema
# consolidated app.yaml into itself 2026-08-18) - nothing here reads
# .platformIdentity.*, forcing that wrapper on would just be cosmetic. gitopsRepoUrl
# IS now bare (no .git suffix), same system-wide convention as every other copy of
# this URL, even though this file's own consumer (idp's tenant-onboarding
# ApplicationSet) never required the change - one URL format everywhere beats a
# case-by-case exemption. No appRepoUrl here - no consumer at the per-env level.
#
# $appName/$env/$cluster/$xrName/$platformOwner/$tenantsRepo/$gitopsRepoUrl/
# $configMapGenerator all come from 00-cluster-gate.yaml - see that file's header for
# why they're declared once there instead of redeclared per file, and why this whole
# resource is wrapped in the $clusterOk gate.
#
# configMapGenerator (added 2026-08-22): only emitted when true, never a literal
# `configMapGenerator: false` line - keeps identity.yaml's shape unchanged for every
# env that hasn't opted in, matching the ApplicationSet's own `hasKey` gate (absent
# key, not false value, is what "not opted in" means there).
<<- if $clusterOk >>
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  name: <<$xrName>>-tenant-identity-yaml
  annotations:
    <<setResourceNameAnnotation "tenant-identity-yaml">>
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    repository: <<$tenantsRepo>>
    file: <<printf "tenants/%s/%s/identity.yaml" $appName $env>>
    overwriteOnCreate: true
    content: |
      appName: <<$appName>>
      gitopsRepoUrl: <<$gitopsRepoUrl>>
      githubOwner: <<$platformOwner>>
      env: <<$env>>
      <<- if $configMapGenerator >>
      configMapGenerator: true
      <<- end >>
    commitMessage: <<printf "Onboard %s %s: add tenants/%s/%s/identity.yaml" $appName $env $appName $env | toJson>>
<<- end >>
