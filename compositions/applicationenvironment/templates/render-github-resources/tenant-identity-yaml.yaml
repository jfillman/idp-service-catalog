# Commits tenants/<appName>/<env>/identity.yaml into that cluster's own
# gitops-cluster-<cluster>-tenants - read by that repo's tenant-onboarding
# ApplicationSet (git generator over tenants/*/*/identity.yaml) to render the real
# deployment Application via idp-application. Matches
# gitops-cluster-dev-tenants/README.md's own documented identity.yaml shape exactly
# (appName/gitopsRepoUrl/githubOwner/env) - deliberately duplicating app.yaml's
# gitopsRepoUrl/githubOwner rather than requiring the ApplicationSet to join two
# files (same reasoning that README already gives). No appRepoUrl here - that field
# only lives on app.yaml, no consumer at the per-env level.
#
# $appName/$env/$cluster/$xrName/$platformOwner/$tenantsRepo/$gitopsRepoUrl all come
# from 00-cluster-gate.yaml - see that file's header for why they're declared once
# there instead of redeclared per file, and why this whole resource is wrapped in
# the $clusterOk gate.
<<- if $clusterOk >>
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  name: <<$xrName>>-tenant-identity-yaml
  annotations:
    <<setResourceNameAnnotation "tenant-identity-yaml">>
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    repository: <<$tenantsRepo>>
    file: <<printf "tenants/%s/%s/identity.yaml" $appName $env>>
    overwriteOnCreate: true
    content: |
      appName: <<$appName>>
      gitopsRepoUrl: <<$gitopsRepoUrl>>
      githubOwner: <<$platformOwner>>
      env: <<$env>>
    commitMessage: <<printf "Onboard %s %s: add tenants/%s/%s/identity.yaml" $appName $env $appName $env | toJson>>
<<- end >>
