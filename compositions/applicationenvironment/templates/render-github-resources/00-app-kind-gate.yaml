# ExtraResources lookup resolving which real XR kind $appName actually is -
# NodeJSApplication or SpringBootApplication. Added once SpringBootApplication went
# from "future" (xrds/applicationenvironment.yaml's own appName description already
# anticipated it, written before either existed) to real and app-usage.yaml's
# previously-hardcoded `kind: NodeJSApplication` was found live to break it.
#
# That hardcoding wasn't just wrong labeling: app-usage.yaml's own header claimed a
# Usage whose `of` target doesn't exist is "simply never matched...harmless no-op" -
# true only for the deletion-protection webhook's purpose. In practice the Usage
# controller never sets a status.conditions[Ready] on an unmatched Usage, and
# function-auto-ready gates THIS composite's own Ready condition on every composed
# resource reaching Ready - so a SpringBootApplication-owned env stayed
# "Unready resources: app-usage" forever. Confirmed live: order-api-kind-prod-prod
# stuck at Ready: False until this fix; checkout-api-kind-prod-prod (a real
# NodeJSApplication) unaffected throughout, its Usage already Ready: True.
#
# Two separate ExtraResources requirements, not one - Crossplane requirements are
# typed per GVK, no "try kind A, fall back to kind B" primitive exists. Defaults to
# NodeJSApplication if neither resolves yet - same "not found yet, retry next
# reconcile" two-pass shape every other gate in this Composition already has, and
# preserves this Composition's prior behavior for the common case.
#
# $appName/$xrNamespace redeclared locally rather than reused from 00-cluster-gate.yaml
# - matches this catalog's existing per-file redeclaration convention (see
# compositions/secretstore's own templates, each independently redeclaring $spec/
# $appName), and keeps this file's own alphabetical position (globbed before
# app-usage.yaml, which is all that actually matters) independent of
# 00-cluster-gate.yaml's.
<<- $spec := .observed.composite.resource.spec >>
<<- $appName := $spec.appName >>
<<- $xrNamespace := .observed.composite.resource.metadata.namespace >>
<<- $allExtra := .extraResources | default dict >>
<<- $nodejsEntry := index $allExtra "app-kind-nodejs" | default dict >>
<<- $nodejsItems := index $nodejsEntry "items" | default list >>
<<- $springbootEntry := index $allExtra "app-kind-springboot" | default dict >>
<<- $springbootItems := index $springbootEntry "items" | default list >>
<<- $appKind := "NodeJSApplication" >>
<<- if gt (len $nodejsItems) 0 >>
  <<- $appKind = "NodeJSApplication" >>
<<- else if gt (len $springbootItems) 0 >>
  <<- $appKind = "SpringBootApplication" >>
<<- end >>
apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
kind: ExtraResources
requirements:
  app-kind-nodejs:
    apiVersion: catalog.idp.io/v1alpha1
    kind: NodeJSApplication
    namespace: <<$xrNamespace>>
    matchName: <<$appName>>
  app-kind-springboot:
    apiVersion: catalog.idp.io/v1alpha1
    kind: SpringBootApplication
    namespace: <<$xrNamespace>>
    matchName: <<$appName>>
