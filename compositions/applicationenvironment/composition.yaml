# GENERATED FILE - do not hand-edit the pipeline's `input.inline.template` blocks
# below. Edit templates/render-github-resources/*.yaml or
# templates/status/*.yaml instead, then run ./build-composition.sh to
# regenerate this file.
#
# Two function-go-templating steps, not one (compositions/nodejsapplication's own
# pattern, copied directly): render-github-resources composes the real
# provider-github managed resources (RepositoryFile - see
# idp/docs/service-catalog-design.md Item 3), status patches the XR's own status
# afterward with exactly one of ClusterReady: False / WorkloadDeployed: False (see
# that template's own header for the mechanism and why). Both share the ONE
# already-installed function-go-templating Function via source: Inline - registering
# a second Function package pointing at the same reference corrupted Crossplane's
# shared dependency-lock graph cluster-wide, a real bug hit live building the SLO
# Composition (see compositions/slo/build-composition.sh's own header) - never
# repeat that here.
#
# Delimiters: << >> instead of Go's default {{ }}, matching every other Composition
# in this catalog - kept consistent even though this one has no PromQL/Sloth
# templating syntax of its own to dodge; `<<setResourceNameAnnotation ...>>` calls
# below are function-go-templating's own helper, unaffected by the delimiter choice.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: applicationenvironments.catalog.idp.io
spec:
  compositeTypeRef:
    apiVersion: catalog.idp.io/v1alpha1
    kind: ApplicationEnvironment
  mode: Pipeline
  pipeline:
    - step: render-github-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            # Real Crossplane extra-resources lookup against the cluster registry
            # (gitops-cluster-dev/00-bootstrap/cluster-registry/, service-catalog-design.md §0) -
            # the first actual use of this mechanism in this catalog, confirmed against
            # function-go-templating v0.12.3's own docs rather than assumed: a `kind:
            # ExtraResources` meta-resource below asks Crossplane's core to fetch a named
            # ConfigMap from the LOCAL cluster (kind-dev, where this Composition's own Crossplane
            # runs - matches Bootstrap-tier's centralized-on-dev design, no cross-cluster read
            # needed for the gate itself). Standard two-pass behavior: the reconcile that first
            # adds this requirement won't see data yet (.extraResources empty) - $clusterOk stays
            # false, same "not found yet, retry next reconcile" shape already used for
            # WorkloadDeployed/CicdOnboarded, not a new failure mode.
            #
            # $clusterOk/$appName/$env/$cluster/$xrName/$gitopsRepoUrl/$tenantsRepo are all
            # declared once here, not redeclared per file below - Go template variables declared
            # at this (unindented) scope persist for the rest of this template's execution
            # across the --- separators, confirmed by this catalog's existing pattern of one big
            # concatenated template per pipeline step (build-composition.sh).
            #
            # Deliberately ONE YAML document in this file, not two - $clusterOk is computed from
            # .extraResources (a fixed input available from the start of this template's
            # execution, regardless of where in the text the ExtraResources requirement below is
            # declared) entirely via template actions with no literal output, BEFORE the
            # ExtraResources document itself. A second, separately `---`-delimited "document"
            # containing only template actions would render to a blank/empty YAML document once
            # executed - untested whether function-go-templating tolerates that, not worth
            # risking when computing everything up front avoids the question entirely.
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $spec := .observed.composite.resource.spec >>
            <<- $appName := $spec.appName >>
            <<- $env := $spec.env >>
            <<- $cluster := $spec.cluster >>
            <<- $platformOwner := "jfillman" >>
            <<- $tenantsRepo := printf "gitops-cluster-%s-tenants" $cluster >>
            <<- $gitopsRepoUrl := printf "https://github.com/%s/gitops-%s.git" $platformOwner $appName >>
            <<- $allExtra := .extraResources | default dict >>
            <<- $entry := index $allExtra "cluster-registry-entry" | default dict >>
            <<- $items := index $entry "items" | default list >>
            <<- $clusterOk := false >>
            <<- $clusterType := "" >>
            <<- $crossplaneReady := "" >>
            <<- if gt (len $items) 0 >>
              <<- $cm := (index $items 0).resource >>
              <<- $clusterType = $cm.data.type >>
              <<- $crossplaneReady = index $cm.data "crossplaneReady" | default "" >>
              <<- if and (eq $clusterType "upper") (eq $crossplaneReady "true") >>
                <<- $clusterOk = true >>
              <<- end >>
            <<- end >>
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              cluster-registry-entry:
                apiVersion: v1
                kind: ConfigMap
                namespace: crossplane-system
                matchName: <<$cluster>>
            ---
            # protection.crossplane.io/v1beta1 Usage - the real Crossplane primitive for the
            # twice-confirmed AppProject/Application deletion-ordering bug (idp/docs/
            # service-catalog-design.md §0 "Where Crossplane runs across a multi-cluster fleet"):
            # pruning NodeJSApplication's own AppProject/tenant onboarding before this env's
            # dependent ArgoCD Application finishes its own finalizer permanently stuck that
            # Application. The design doc originally called for a homegrown extra-resources
            # lookup on NodeJSApplication's own Composition (query for remaining
            # ApplicationEnvironment XRs, refuse deletion if any exist) - superseded here once
            # `kubectl api-resources` confirmed Crossplane itself ships a real primitive for
            # exactly this: protection.crossplane.io/v1beta1 Usage (NOT the deprecated
            # apiextensions.crossplane.io one - `kubectl explain` on that older kind warns to
            # migrate), enforced by a live `crossplane-no-usages` admission webhook already
            # installed with this cluster's Crossplane (nothing new to deploy). Native mechanism
            # over a hand-rolled one: a clean, immediate admission-time rejection on `kubectl
            # delete nodejsapplication` while any Usage still references it, not a finalizer
            # hang - and needs ZERO changes to NodeJSApplication's own Composition/XRD, since the
            # webhook + Usage controller do all the work purely by watching Usage objects,
            # regardless of what composed them.
            #
            # spec.of targets the parent NodeJSApplication by $appName (spec.appName - see
            # xrds/applicationenvironment.yaml's own field description for why trusting it here
            # is safe even though it's otherwise "labeling/audit only, no live existence check":
            # a Usage against a NodeJSApplication that doesn't actually exist by that name is
            # simply never matched by the Usage controller, so it never blocks anything - no
            # admission-time existence check needed for THIS mechanism to be correct, only for
            # the RepositoryFile writes elsewhere in this template, which already fail loudly and
            # separately if $appName doesn't resolve to a real gitops-<appName> repo).
            #
            # $xrNamespace comes from this XR's own metadata (Crossplane v2, scope: Namespaced) -
            # NodeJSApplication and ApplicationEnvironment are always onboarded into the same
            # namespace by this catalog's convention (see both XRDs' own headers), not otherwise
            # derivable from spec.appName alone. Declared locally here rather than added to
            # 00-cluster-gate.yaml's shared var block - doesn't touch that file's existing
            # cluster-registry gate declarations at all.
            #
            # spec.by has no namespace field (by design - "by" is implicitly the same namespace as
            # the Usage object itself, which is this ApplicationEnvironment XR's own namespace,
            # since a namespaced XR's composed namespaced resources land in its own namespace
            # automatically - same implicit placement every RepositoryFile composed elsewhere in
            # this template already relies on, no explicit metadata.namespace needed anywhere).
            #
            # Deliberately UNCONDITIONAL - not wrapped in the $clusterOk gate every other resource
            # in this directory is (see 00-cluster-gate.yaml). "This env references this app"
            # (spec.appName) is true from XR creation regardless of whether the target cluster
            # passed the registry gate - gating this on $clusterOk would let an
            # ApplicationEnvironment targeting an unready/unregistered cluster exist with zero
            # deletion protection on its parent app, reopening exactly the bug this resource
            # exists to close.
            #
            # replayDeletion: true - defensive backstop for the race between this Usage's own
            # creation and the Usage controller labeling NodeJSApplication crossplane.io/in-use
            # (the label crossplane-no-usages' objectSelector keys off): if `kubectl delete
            # nodejsapplication` somehow lands in that narrow window before the label is set, this
            # replays the deletion attempt automatically once the last blocking Usage is actually
            # gone, instead of leaving it needing a manual re-delete.
            <<- $xrNamespace := .observed.composite.resource.metadata.namespace >>
            apiVersion: protection.crossplane.io/v1beta1
            kind: Usage
            metadata:
              name: <<$xrName>>-app-usage
              annotations:
                <<setResourceNameAnnotation "app-usage">>
            spec:
              of:
                apiVersion: catalog.idp.io/v1alpha1
                kind: NodeJSApplication
                resourceRef:
                  name: <<$appName>>
                  namespace: <<$xrNamespace>>
              by:
                apiVersion: catalog.idp.io/v1alpha1
                kind: ApplicationEnvironment
                resourceRef:
                  name: <<$xrName>>
              reason: <<printf "ApplicationEnvironment %s references NodeJSApplication %s via spec.appName - blocks app deletion until every referencing env is gone (idp/docs/service-catalog-design.md §0)" $xrName $appName | toJson>>
              replayDeletion: true
            ---
            # Seeds this app's tenants/<appName>/app.yaml on the TARGET cluster's own
            # gitops-cluster-<cluster>-tenants repo - needed because NodeJSApplication only ever
            # writes the devCluster's copy (gitops-cluster-dev-tenants today), but §6 of
            # gitops-strategy.md scopes AppProject per cluster: an app deployed to N clusters
            # needs N independently-generated AppProjects, each built by that cluster's own
            # tenant-appprojects ApplicationSet from that cluster's own app.yaml. Every
            # ApplicationEnvironment targeting a given (app, cluster) pair writes this
            # unconditionally and idempotently (same overwriteOnCreate: true, deterministic
            # content, no "is this the first one for this cluster" branch needed - matches this
            # catalog's general "redundant-but-harmless idempotent writes over a matrix
            # generator" convention).
            #
            # managementPolicies (everything except "Delete") - deliberately different from
            # every other RepositoryFile in this catalog, which get the provider's default
            # (management policies on, "*"/all actions). A real correctness issue found
            # designing this, not discovered live: if this resource were owned 1:1 by whichever
            # ApplicationEnvironment XR happens to compose it, deleting ONE env on a cluster
            # (while a sibling env on that SAME cluster still exists) would delete the cluster's
            # shared app.yaml out from under it, breaking that cluster's AppProject for the
            # surviving env. Excluding "Delete" means deleting any single env's XR never deletes
            # the cluster's shared app.yaml - cleaning it up when an app is fully decommissioned
            # from a cluster becomes a deliberate, separate cluster-admin action, not automatic.
            # An accepted, explicitly documented limitation, not silently left looking solved.
            #
            # NOT spec.deletionPolicy: Orphan - a real, live gotcha this catalog hadn't hit
            # before. provider-upjet-github v0.19.1's RepositoryFile CRD has no such field at
            # all (confirmed via `kubectl explain repositoryfile.spec` after a real
            # ReconcileError: ".spec.deletionPolicy: field not declared in schema") - this
            # provider version uses the newer ManagementPolicies mechanism exclusively instead,
            # which is Crossplane's real replacement for deletionPolicy generally. Worth
            # checking `kubectl explain` for whichever field a provider version actually
            # supports before assuming the older name still applies.
            #
            # $appName/$cluster/$xrName/$platformOwner/$tenantsRepo/$gitopsRepoUrl all come from
            # 00-cluster-gate.yaml - see that file's header. No appRepoUrl consumer at this
            # level either (same reasoning NodeJSApplication's own app.yaml write already uses)
            # - omitted here deliberately, not an oversight.
            <<- if $clusterOk >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-cluster-app-yaml
              annotations:
                <<setResourceNameAnnotation "cluster-app-yaml">>
            spec:
              managementPolicies: ["Create", "Update", "Observe", "LateInitialize"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$tenantsRepo>>
                file: <<printf "tenants/%s/app.yaml" $appName>>
                overwriteOnCreate: true
                content: |
                  appName: <<$appName>>
                  gitopsRepoUrl: <<$gitopsRepoUrl>>
                  githubOwner: <<$platformOwner>>
                commitMessage: <<printf "Onboard %s to %s: add tenants/%s/app.yaml" $appName $cluster $appName | toJson>>
            <<- end >>
            ---
            # Commits two SecretStore XR manifests into this cluster's OWN
            # gitops-cluster-<cluster>-tenants/tenants/<appName>/xr-requests/ - picked up by
            # THAT cluster's own xr-requests ApplicationSet (kind-dev's already existed;
            # kind-prod's is new, gitops-cluster-kind-prod/02-argocd-apps/xr-requests/ -
            # every upper cluster needs its own copy of this mechanism now, mirrored, not
            # shared, since xr-requests is inherently per-cluster: it applies directly onto
            # whichever cluster's ArgoCD is watching it).
            #
            # Real, deliberate correction of the original design (idp/docs/
            # service-catalog-design.md Item 8's second multi-cluster revision - see
            # nodejsapplication's own secretstore-xr.yaml for the full "why", same reasoning
            # applies here): this used to be idp-application's own always-on chart resource,
            # meaning secrets infrastructure for an upper-cluster env didn't exist until
            # someone actually shipped a real release through it. Now it exists the moment
            # THIS XR reconciles - a pure git commit, same as everything else this XRD
            # already does.
            #
            # Both resources are wrapped in the SAME $clusterOk gate as this Composition's
            # other resources (00-cluster-gate.yaml) - no secrets infrastructure is
            # requested for a cluster that isn't real/ready either.
            #
            # Resource 1, "shared" mode: same file path/content REGARDLESS of which env
            # triggered it - every sibling ApplicationEnvironment for this (app, cluster)
            # pair writes the identical manifest (overwriteOnCreate: true, deterministic
            # content) - the exact same "redundant-but-harmless idempotent writes" idiom
            # cluster-app-yaml.yaml already established for this identical "N siblings, one
            # shared thing" shape, not a new mechanism.
            #
            # Resource 2, per-environment mode: file path/content is UNIQUE per env
            # (tenants/<appName>/xr-requests/secretstore-<env>.yaml, environmentSlug: <env>)
            # - no redundancy concern, this one genuinely is 1:1 with this XR.
            #
            # $appName/$env/$cluster/$xrName/$tenantsRepo all come from 00-cluster-gate.yaml.
            <<- if $clusterOk >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-secretstore-shared-xr
              annotations:
                <<setResourceNameAnnotation "secretstore-shared-xr">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$tenantsRepo>>
                file: <<printf "tenants/%s/xr-requests/secretstore-shared.yaml" $appName>>
                overwriteOnCreate: true
                content: |
                  apiVersion: catalog.idp.io/v1alpha1
                  kind: SecretStore
                  metadata:
                    name: <<printf "%s-%s" $appName $cluster>>
                  spec:
                    appRef:
                      name: <<$appName>>
                    cluster: <<$cluster>>
                commitMessage: <<printf "Onboard %s %s: add tenants/%s/xr-requests/secretstore-shared.yaml" $appName $env $appName | toJson>>
            ---
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-secretstore-env-xr
              annotations:
                <<setResourceNameAnnotation "secretstore-env-xr">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$tenantsRepo>>
                file: <<printf "tenants/%s/xr-requests/secretstore-%s.yaml" $appName $env>>
                overwriteOnCreate: true
                content: |
                  apiVersion: catalog.idp.io/v1alpha1
                  kind: SecretStore
                  metadata:
                    name: <<printf "%s-%s-%s" $appName $cluster $env>>
                  spec:
                    appRef:
                      name: <<$appName>>
                    cluster: <<$cluster>>
                    environmentSlug: <<$env>>
                commitMessage: <<printf "Onboard %s %s: add tenants/%s/xr-requests/secretstore-%s.yaml" $appName $env $appName $env | toJson>>
            <<- end >>
            ---
            # Commits tenants/<appName>/<env>/identity.yaml into that cluster's own
            # gitops-cluster-<cluster>-tenants - read by that repo's tenant-onboarding
            # ApplicationSet (git generator over tenants/*/*/identity.yaml) to render the real
            # deployment Application via idp-application. Matches
            # gitops-cluster-dev-tenants/README.md's own documented identity.yaml shape exactly
            # (appName/gitopsRepoUrl/githubOwner/env) - deliberately duplicating app.yaml's
            # gitopsRepoUrl/githubOwner rather than requiring the ApplicationSet to join two
            # files (same reasoning that README already gives). No appRepoUrl here - that field
            # only lives on app.yaml, no consumer at the per-env level.
            #
            # $appName/$env/$cluster/$xrName/$platformOwner/$tenantsRepo/$gitopsRepoUrl all come
            # from 00-cluster-gate.yaml - see that file's header for why they're declared once
            # there instead of redeclared per file, and why this whole resource is wrapped in
            # the $clusterOk gate.
            <<- if $clusterOk >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-tenant-identity-yaml
              annotations:
                <<setResourceNameAnnotation "tenant-identity-yaml">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$tenantsRepo>>
                file: <<printf "tenants/%s/%s/identity.yaml" $appName $env>>
                overwriteOnCreate: true
                content: |
                  appName: <<$appName>>
                  gitopsRepoUrl: <<$gitopsRepoUrl>>
                  githubOwner: <<$platformOwner>>
                  env: <<$env>>
                commitMessage: <<printf "Onboard %s %s: add tenants/%s/%s/identity.yaml" $appName $env $appName $env | toJson>>
            <<- end >>
            ---
            # Commits <cluster>/<env>/values.yaml into the app's own gitops-<appName> repo
            # (already created, empty, by NodeJSApplication - see that XRD's own header). Read by
            # gitops-cluster-<cluster>/02-argocd-apps/tenant-onboarding/applicationset.yaml's
            # second source ($ref'd valueFiles: - $appsrc/<cluster>/{{.env}}/values.yaml).
            #
            # $clusterOk/$appName/$env/$cluster/$xrName all come from 00-cluster-gate.yaml,
            # declared once there - see that file's own header for why. Wrapped in the gate: if
            # the target cluster isn't a registered, crossplaneReady upper-env cluster, this
            # resource simply isn't rendered at all - the status step reports ClusterReady: False
            # instead, same "structural backstop, refuse rather than partially succeed" instinct
            # already used for the WorkloadDeployed condition below.
            #
            # rollout: null (not a placeholder image) - there's no real image to deploy yet, this
            # platform's CICD control plane isn't running on kind-dev (same gap
            # NodeJSApplication already reports via CicdOnboarded). idp-application's chart
            # already fixture-tests rollout: null cleanly (no Rollout/Service/HPA/PDB rendered,
            # just NetworkPolicy/ServiceAccount) - see charts/idp-application/README.md's "Live-
            # verified" section.
            <<- if $clusterOk >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-values-yaml
              annotations:
                <<setResourceNameAnnotation "values-yaml">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<printf "gitops-%s" $appName>>
                file: <<printf "%s/%s/values.yaml" $cluster $env>>
                overwriteOnCreate: true
                content: |
                  appName: <<$appName>>
                  appType: app
                  cluster: <<$cluster>>
                  envName: <<$env>>
                  rollout: null
                commitMessage: <<printf "Bootstrap %s environment: add %s/%s/values.yaml" $env $cluster $env | toJson>>
            <<- end >>
            ---
        delims:
          left: "<<"
          right: ">>"
    - step: detect-ready
      functionRef:
        name: function-auto-ready
    - step: status
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            # Reports exactly one of two mutually-exclusive custom conditions, never both, never
            # neither - renamed from workload-status (singular concern) now that there are two:
            # whether the target cluster passed the registry gate (§0 of
            # service-catalog-design.md), and, only if it did, whether a real workload image
            # exists yet (unchanged from the original WorkloadDeployed mechanism). Reporting
            # WorkloadDeployed when the cluster gate failed would be misleading - nothing was
            # created, so "no image yet" isn't the actual reason there's no deployment.
            #
            # Redeclares the same ExtraResources requirement 00-cluster-gate.yaml (the
            # render-github-resources step) already declares, rather than assuming this step can
            # see that step's now-out-of-scope template variables - each pipeline step is a
            # separate function-go-templating invocation with its own template execution.
            # function-go-templating's own docs confirm extraResources ARE cached in the pipeline
            # context and passed to later steps, so this doesn't trigger a second live fetch -
            # but redeclaring keeps this step self-contained and correct even if the pipeline
            # ever gets reordered, matching this catalog's general "repetition over cross-file
            # coupling" convention (compositions/applicationenvironment/templates/render-github-
            # resources/*.yaml each redeclare $xrName/$spec too).
            #
            # Ready itself stays real (whatever detect-ready, the pipeline step before this one,
            # computes from whichever - if any - composed resources actually exist). Direct
            # extension of NodeJSApplication's own cicd-onboarding-status mechanism -
            # function-go-templating reserves Ready/Healthy/Synced and errors if a Composition
            # tries to set them directly via ClaimConditions - confirmed live during that build.
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $spec := .observed.composite.resource.spec >>
            <<- $env := $spec.env >>
            <<- $cluster := $spec.cluster >>
            <<- $allExtra := .extraResources | default dict >>
            <<- $entry := index $allExtra "cluster-registry-entry" | default dict >>
            <<- $items := index $entry "items" | default list >>
            <<- $clusterOk := false >>
            <<- if gt (len $items) 0 >>
              <<- $cm := (index $items 0).resource >>
              <<- $clusterType := $cm.data.type >>
              <<- $crossplaneReady := index $cm.data "crossplaneReady" | default "" >>
              <<- if and (eq $clusterType "upper") (eq $crossplaneReady "true") >>
                <<- $clusterOk = true >>
              <<- end >>
            <<- end >>
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              cluster-registry-entry:
                apiVersion: v1
                kind: ConfigMap
                namespace: crossplane-system
                matchName: <<$cluster>>
            ---
            <<- if not $clusterOk >>
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
              - type: ClusterReady
                status: "False"
                reason: ClusterNotEligible
                message: >-
                  <<$xrName>>'s target cluster (<<$cluster>>) isn't a registered, ready
                  upper-env cluster - either it isn't in the cluster registry yet
                  (gitops-cluster-dev/00-bootstrap/cluster-registry/), it's registered as
                  type: dev (this XRD only ever targets upper-env clusters - see its own
                  header comment), or crossplaneReady isn't "true" yet. No resources have
                  been created. Resolves itself once the registry entry is correct - no XR
                  edit needed.
                target: CompositeAndClaim
            <<- else >>
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
              - type: WorkloadDeployed
                status: "False"
                reason: NoImageYet
                message: >-
                  <<$xrName>>'s <<$env>> values.yaml and tenant identity are provisioned, but
                  rollout is null - there's no real container image to deploy yet
                  (platform-cicd-on-kind-dev migration hasn't landed, and no developer PR has
                  set rollout.image). This condition does not auto-clear once one does; it
                  reflects the state at bootstrap time only.
                target: CompositeAndClaim
            <<- end >>
            ---
        delims:
          left: "<<"
          right: ">>"
