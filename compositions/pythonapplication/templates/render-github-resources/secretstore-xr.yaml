# Commits a "shared"-mode SecretStore XR manifest into
# tenants/<app-name>/xr-requests/secretstore.yaml - identical mechanism to
# nodejsapplication's own secretstore-xr.yaml (straight port, not a redesign - see
# that file's own header for the full design history/rationale). Picked up by this
# app's own devCluster's xr-requests ApplicationSet (gitops-cluster-dev/
# 02-argocd-apps/xr-requests/, for kind-dev), applied directly (no Helm release
# needed) into app-<app-name>-cicd on that cluster.
#
# spec.devCluster, not a hardcoded "kind-dev": this is the app's OWN dev-cluster
# secrets store, always exactly one, matching xrds/secretstore.yaml's own "one
# shared environment for the dev cluster" scope. $clusterOk/$tenantsRepo come from
# 00-devcluster-gate.yaml (same pipeline step), which also validates spec.devCluster
# live against the cluster registry before this resource renders at all.
<<- if $clusterOk >>
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  name: <<$xrName>>-secretstore-xr
  annotations:
    <<setResourceNameAnnotation "secretstore-xr">>
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    repository: <<$tenantsRepo>>
    file: <<printf "tenants/%s/xr-requests/secretstore.yaml" $xrName>>
    overwriteOnCreate: true
    content: |
      apiVersion: catalog.idp.io/v1alpha1
      kind: SecretStore
      metadata:
        name: <<printf "%s-%s" $xrName $devCluster>>
      spec:
        appRef:
          name: <<$xrName>>
        cluster: <<$devCluster>>
    commitMessage: <<printf "Onboard %s: add tenants/%s/xr-requests/secretstore.yaml" $xrName $xrName | toJson>>
<<- end >>
