# GENERATED FILE - do not hand-edit the pipeline's `input.inline.template` blocks
# below. Edit templates/render-github-resources/*.yaml or
# templates/cicd-onboarding-status/*.yaml instead, then run ./build-composition.sh to
# regenerate this file.
#
# Two function-go-templating steps, not one (compositions/nodejsapplication's own
# pattern, ported here): render-github-resources composes the real provider-github
# managed resources plus a composed TektonCICD child (CI/CD onboarding lives there
# now, not inline - see xrds/tektoncicd.yaml), cicd-onboarding-status proxies that
# child's own DevClusterReady/CicdOnboarded conditions onto this XR afterward. Both
# share the ONE already-installed function-go-templating Function via source: Inline.
#
# Delimiters: << >> instead of Go's default {{ }}, matching every other Composition
# in this catalog.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: pythonapplications.catalog.idp.io
spec:
  compositeTypeRef:
    apiVersion: catalog.idp.io/v1alpha1
    kind: PythonApplication
  mode: Pipeline
  pipeline:
    - step: render-github-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            # Real Crossplane extra-resources lookup against the cluster registry
            # (gitops-cluster-dev/00-bootstrap/cluster-registry/, service-catalog-design.md §0) -
            # identical mechanism to nodejsapplication's own 00-devcluster-gate.yaml (straight
            # port, not a redesign - see that file's own header for the full "why" this gate
            # exists and why $tenantsRepo comes from registry data rather than a hardcoded
            # literal). Still needed here even though CI/CD onboarding itself now lives in
            # TektonCICD - secretstore-xr.yaml (this same pipeline step) needs its own
            # $clusterOk/$tenantsRepo.
            #
            # $clusterOk/$xrName/$devCluster/$tenantsRepo are declared once here, not redeclared
            # per file below - Go template variables declared at this (unindented) scope persist
            # for the rest of THIS pipeline step's execution across the --- separators.
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $spec := .observed.composite.resource.spec >>
            <<- $devCluster := $spec.devCluster >>
            <<- $allExtra := .extraResources | default dict >>
            <<- $entry := index $allExtra "devcluster-registry-entry" | default dict >>
            <<- $items := index $entry "items" | default list >>
            <<- $clusterOk := false >>
            <<- $clusterType := "" >>
            <<- $cicdReady := "" >>
            <<- $tenantsRepo := "" >>
            <<- if gt (len $items) 0 >>
              <<- $cm := (index $items 0).resource >>
              <<- $clusterType = $cm.data.type >>
              <<- $cicdReady = index $cm.data "cicdReady" | default "" >>
              <<- $tenantsRepo = index $cm.data "tenantsRepo" | default "" >>
              <<- if and (eq $clusterType "dev") (eq $cicdReady "true") >>
                <<- $clusterOk = true >>
              <<- end >>
            <<- end >>
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              devcluster-registry-entry:
                apiVersion: v1
                kind: ConfigMap
                namespace: crossplane-system
                matchName: <<$devCluster>>
            ---
            # Empty, scaffolded gitops-<app-name> repo - identical mechanism to
            # nodejsapplication's own gitops-repo.yaml (straight port, not a redesign). Just a
            # README for now; the real <cluster>/<env>/values.yaml layout gets populated once
            # ApplicationEnvironment exists.
            #
            # crossplane.io/external-name below - same fix, same reasoning as src-repo.yaml's own
            # header: a cluster rebuild's fresh Repository MR has no external-name, so
            # provider-github tries to Create a repo that already exists on GitHub and 422s.
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $spec := .observed.composite.resource.spec >>
            <<- $visibility := $spec.visibility >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: Repository
            metadata:
              name: <<$xrName>>-gitops
              annotations:
                <<setResourceNameAnnotation "gitops-repo">>
                crossplane.io/external-name: <<printf "gitops-%s" $xrName>>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                name: <<printf "gitops-%s" $xrName>>
                description: <<printf "GitOps deployment repo for %s - <cluster>/<env>/values.yaml per environment" $xrName | toJson>>
                visibility: <<$visibility>>
                autoInit: true
                securityAndAnalysis:
                  - secretScanning:
                      - status: disabled
                    secretScanningPushProtection:
                      - status: disabled
            ---
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-gitops-readme
              annotations:
                <<setResourceNameAnnotation "gitops-repo-readme">>
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize", "Delete"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<printf "gitops-%s" $xrName>>
                file: README.md
                overwriteOnCreate: true
                content: |
                  # gitops-<<$xrName>>

                  GitOps deployment repo for `<<$xrName>>`, scaffolded by `PythonApplication`
                  (idp-service-catalog). Empty until this app's first `ApplicationEnvironment`
                  resource is created - each environment gets its own `<cluster>/<env>/values.yaml`
                  here, rendered by `idp-application` (idp-service-catalog's shared Helm chart).
                commitMessage: "PythonApplication scaffold: README.md"
            ---
            # Commits a "shared"-mode SecretStore XR manifest into
            # tenants/<app-name>/xr-requests/secretstore.yaml - identical mechanism to
            # nodejsapplication's own secretstore-xr.yaml (straight port, not a redesign - see
            # that file's own header for the full design history/rationale). Picked up by this
            # app's own devCluster's xr-requests ApplicationSet (gitops-cluster-dev/
            # 02-argocd-apps/xr-requests/, for kind-dev), applied directly (no Helm release
            # needed) into app-<app-name>-cicd on that cluster.
            #
            # spec.devCluster, not a hardcoded "kind-dev": this is the app's OWN dev-cluster
            # secrets store, always exactly one, matching xrds/secretstore.yaml's own "one
            # shared environment for the dev cluster" scope. $clusterOk/$tenantsRepo come from
            # 00-devcluster-gate.yaml (same pipeline step), which also validates spec.devCluster
            # live against the cluster registry before this resource renders at all.
            <<- if $clusterOk >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-secretstore-xr
              annotations:
                <<setResourceNameAnnotation "secretstore-xr">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$tenantsRepo>>
                file: <<printf "tenants/%s/xr-requests/secretstore.yaml" $xrName>>
                overwriteOnCreate: true
                content: |
                  apiVersion: catalog.idp.io/v1alpha1
                  kind: SecretStore
                  metadata:
                    name: <<printf "%s-%s" $xrName $devCluster>>
                  spec:
                    appRef:
                      name: <<$xrName>>
                    cluster: <<$devCluster>>
                commitMessage: <<printf "Onboard %s: add tenants/%s/xr-requests/secretstore.yaml" $xrName $xrName | toJson>>
            <<- end >>
            ---
            # Src repo + Python boilerplate. Rendered by function-go-templating (source: Inline,
            # see ../composition.yaml/../build-composition.sh), using double-angle-bracket
            # delimiters - same convention as nodejsapplication's own src-repo.yaml.
            #
            # repo.github.m.upbound.io (namespaced managed resources), not the Cluster-scoped
            # repo.github.upbound.io family. providerConfigRef.kind: ClusterProviderConfig is
            # required, not defaulted.
            #
            # crossplane.io/external-name on the Repository below - same live-bug fix as
            # nodejsapplication's own src-repo.yaml (a cluster rebuild's fresh Repository MR has
            # no external-name, so provider-github tries to Create a repo that already exists on
            # GitHub and 422s; setting external-name up front makes the MR import/adopt the
            # existing repo instead).
            #
            # managementPolicies: ["Create", "Observe", "LateInitialize", "Delete"] (no "Update")
            # on every RepositoryFile below - same reasoning as nodejsapplication's own scaffold
            # files: this is real app source a developer is expected to edit immediately after
            # scaffolding, and the provider's default "*" policy would drift-correct any such
            # edit back to this static template on its next reconcile (a real bug hit live for
            # checkout-api's package.json - never repeat it here).
            #
            # Zero external dependencies in the scaffold itself (stdlib http.server, no
            # framework) - same minimalism NodeJSApplication's own boilerplate keeps (raw
            # `http` module, no express) rather than picking a Python web framework on every
            # app's behalf.
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $spec := .observed.composite.resource.spec >>
            <<- $description := $spec.description | default (printf "%s - a Python application" $xrName) >>
            <<- $pythonVersion := $spec.pythonVersion >>
            <<- $packageManager := $spec.packageManager >>
            <<- $port := $spec.port >>
            <<- $visibility := $spec.visibility >>
            <<- $installCmd := "pip install --no-cache-dir -r requirements.txt" >>
            <<- if eq $packageManager "poetry" >>
              <<- $installCmd = "pip install --no-cache-dir poetry && poetry install --no-root --no-interaction" >>
            <<- else if eq $packageManager "uv" >>
              <<- $installCmd = "pip install --no-cache-dir uv && uv sync --frozen --no-dev" >>
            <<- end >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: Repository
            metadata:
              name: <<$xrName>>-src
              annotations:
                <<setResourceNameAnnotation "src-repo">>
                crossplane.io/external-name: <<$xrName>>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                name: <<$xrName>>
                description: <<$description | toJson>>
                visibility: <<$visibility>>
                autoInit: true
                hasIssues: true
                deleteBranchOnMerge: true
                securityAndAnalysis:
                  - secretScanning:
                      - status: disabled
                    secretScanningPushProtection:
                      - status: disabled
            ---
            <<- if eq $packageManager "pip" >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-requirements-txt
              annotations:
                <<setResourceNameAnnotation "src-repo-dependency-file">>
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize", "Delete"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: requirements.txt
                overwriteOnCreate: true
                content: |
                  # No dependencies yet - main.py is stdlib-only.
                commitMessage: "PythonApplication scaffold: requirements.txt"
            <<- else >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-pyproject-toml
              annotations:
                <<setResourceNameAnnotation "src-repo-dependency-file">>
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize", "Delete"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: pyproject.toml
                overwriteOnCreate: true
                content: |
                  [project]
                  name = <<$xrName | toJson>>
                  version = "0.1.0"
                  description = <<$description | toJson>>
                  requires-python = <<printf ">=%s" $pythonVersion | toJson>>
                  dependencies = []
                commitMessage: "PythonApplication scaffold: pyproject.toml"
            <<- end >>
            ---
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-main-py
              annotations:
                <<setResourceNameAnnotation "src-repo-main-py">>
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize", "Delete"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: main.py
                overwriteOnCreate: true
                content: |
                  import json
                  import os
                  from http.server import BaseHTTPRequestHandler, HTTPServer

                  PORT = int(os.environ.get("PORT", <<$port>>))


                  class Handler(BaseHTTPRequestHandler):
                      def do_GET(self):
                          if self.path == "/healthz":
                              self.send_response(200)
                              self.send_header("Content-Type", "application/json")
                              self.end_headers()
                              self.wfile.write(json.dumps({"status": "ok"}).encode())
                              return
                          self.send_response(200)
                          self.send_header("Content-Type", "text/plain")
                          self.end_headers()
                          self.wfile.write(<<printf "Hello from %s\n" $xrName | toJson>>.encode())


                  if __name__ == "__main__":
                      server = HTTPServer(("0.0.0.0", PORT), Handler)
                      print(<<printf "%s listening on port {}" $xrName | toJson>>.format(PORT))
                      server.serve_forever()
                commitMessage: "PythonApplication scaffold: main.py"
            ---
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-dockerfile
              annotations:
                <<setResourceNameAnnotation "src-repo-dockerfile">>
              # `apt-get upgrade` picks up already-published Debian package patches, same
              # patch-freshness reasoning as nodejsapplication's/springbootapplication's own
              # Dockerfiles. python:<version>-slim, not -alpine - avoids musl/manylinux wheel
              # compatibility issues alpine's libc would otherwise risk for any future
              # dependency this app adds.
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize", "Delete"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: Dockerfile
                overwriteOnCreate: true
                content: |
                  FROM python:<<$pythonVersion>>-slim
                  WORKDIR /app
                  RUN apt-get update && apt-get upgrade -y && rm -rf /var/lib/apt/lists/*
                  <<- if eq $packageManager "pip" >>
                  COPY requirements.txt ./
                  <<- else >>
                  COPY pyproject.toml ./
                  <<- end >>
                  RUN <<$installCmd>>
                  COPY . .
                  EXPOSE <<$port>>
                  CMD ["python", "main.py"]
                commitMessage: "PythonApplication scaffold: Dockerfile"
            ---
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-gitignore
              annotations:
                <<setResourceNameAnnotation "src-repo-gitignore">>
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize", "Delete"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: .gitignore
                overwriteOnCreate: true
                content: |
                  __pycache__/
                  *.pyc
                  .venv/
                  .env
                commitMessage: "PythonApplication scaffold: .gitignore"
            ---
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-readme
              annotations:
                <<setResourceNameAnnotation "src-repo-readme">>
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize", "Delete"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: README.md
                overwriteOnCreate: true
                content: |
                  # <<$xrName>>

                  <<$description>>

                  Scaffolded by `PythonApplication` (idp-service-catalog). Python <<$pythonVersion>>,
                  <<$packageManager>>.

                  ```
                  <<$installCmd>>
                  python main.py
                  ```

                  **CICD pipeline onboarding**: this app's `PythonApplication` resource carries a
                  `CicdOnboarded` condition tracking whether `platform-cicd`'s tenant-onboarding
                  ApplicationSet has picked up this app's committed tenant identity yet. See the
                  resource's own status for details.
                commitMessage: "PythonApplication scaffold: README.md"
            ---
            # Composes a TektonCICD child XR directly - identical mechanism to
            # nodejsapplication's own tekton-cicd-child.yaml (straight port, not a redesign -
            # see that file's own header, and xrds/tektoncicd.yaml's own header, for the full
            # reasoning on why this is a direct composition rather than a GitOps xr-requests
            # commit like SecretStore's own sibling template uses).
            #
            # Unconditional - not locally gated on $clusterOk. TektonCICD's own internal
            # devcluster gate now owns that decision.
            <<- $platformOwner := "jfillman" >>
            apiVersion: catalog.idp.io/v1alpha1
            kind: TektonCICD
            metadata:
              name: <<$xrName>>-tektoncicd
              annotations:
                <<setResourceNameAnnotation "tektoncicd">>
            spec:
              appName: <<$xrName>>
              gitopsRepoUrl: <<printf "https://github.com/%s/gitops-%s" $platformOwner $xrName>>
              appRepoUrl: <<printf "https://github.com/%s/%s" $platformOwner $xrName>>
              devCluster: <<$devCluster>>
            ---
            ---
        delims:
          left: "<<"
          right: ">>"
    - step: detect-ready
      functionRef:
        name: function-auto-ready
    - step: cicd-onboarding-status
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            # Proxies DevClusterReady/CicdOnboarded straight from the composed TektonCICD
            # child's own status.conditions onto this XR's status. Identical mechanism to
            # nodejsapplication's own cicd-onboarding-status/status.yaml (straight port, not a
            # redesign) - see that file's own header for the full "why".
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $allObserved := .observed.resources | default dict >>
            <<- $childRes := index $allObserved "tektoncicd" | default dict >>
            <<- $childXR := index $childRes "resource" | default dict >>
            <<- $childStatus := index $childXR "status" | default dict >>
            <<- $childConditions := index $childStatus "conditions" | default list >>
            <<- $devClusterCondition := dict >>
            <<- $cicdOnboardedCondition := dict >>
            <<- range $childConditions >>
              <<- if eq .type "DevClusterReady" >>
                <<- $devClusterCondition = . >>
              <<- else if eq .type "CicdOnboarded" >>
                <<- $cicdOnboardedCondition = . >>
              <<- end >>
            <<- end >>
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
            <<- if $devClusterCondition >>
              - type: DevClusterReady
                status: <<$devClusterCondition.status | toJson>>
                reason: <<$devClusterCondition.reason>>
                message: <<$devClusterCondition.message | toJson>>
                target: CompositeAndClaim
            <<- else >>
              - type: DevClusterReady
                status: "False"
                reason: DevClusterNotReady
                message: >-
                  Waiting on the composed TektonCICD child (<<$xrName>>-tektoncicd) to report
                  its own DevClusterReady condition - resolves itself once it does.
                target: CompositeAndClaim
            <<- end >>
            <<- if $cicdOnboardedCondition >>
              - type: CicdOnboarded
                status: <<$cicdOnboardedCondition.status | toJson>>
                reason: <<$cicdOnboardedCondition.reason>>
                message: <<$cicdOnboardedCondition.message | toJson>>
                target: CompositeAndClaim
            <<- else >>
              - type: CicdOnboarded
                status: "False"
                reason: CicdOnboardingPending
                message: >-
                  Waiting on the composed TektonCICD child (<<$xrName>>-tektoncicd) to report
                  its own CicdOnboarded condition - resolves itself once it does.
                target: CompositeAndClaim
            <<- end >>
            ---
        delims:
          left: "<<"
          right: ">>"
