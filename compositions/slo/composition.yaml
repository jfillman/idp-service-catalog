# Pipeline shape matches ai-rollout/crossplane/composition/composition.yaml
# (render step + function-auto-ready), but with its OWN function-go-templating
# registration (function-go-templating-slo, see
# gitops-cluster-dev/10-crds-operators/crossplane/function-slo-templates.yaml)
# instead of reusing the shared `function-go-templating` + `mount-templates`
# mount the ai-rollout Application Composition already owns - that mount's
# single ConfigMap holds ai-rollout's own 4 files (rollout/service/
# analysistemplate/configmap), all keyed on spec.parameters.* fields an SLO XR
# doesn't have. Pointing a second Composition's dirPath at that same mount
# would render those 4 templates against every SLO XR too.
#
# Renders a Sloth (sloth.dev) `PrometheusServiceLevel` + a Grafana dashboard
# ConfigMap - NOT a PrometheusRule directly. Sloth's own controller
# (gitops-cluster-dev/10-crds-operators/sloth/) does the spec->PrometheusRule
# translation. See service-catalog-design.md Item 4's revision history: this
# Composition originally hand-rolled the multi-window-multi-burn-rate PromQL
# itself (matching a kube-slo-style article the user found), then switched to
# wrapping Sloth - the hand-rolled version worked and was live-verified, but
# Sloth gives the full canonical 4-window pattern for free instead of a
# simplified 2-tier one, and matches this project's "wrap, don't reinvent"
# convention used everywhere else (Argo Rollouts, ESO, component charts).
#
# Delimiters: << >> instead of ai-rollout's [[ ]] or Go's default {{ }}. Two
# reasons, not one - and BOTH still apply even though this Composition no
# longer emits raw PromQL/PrometheusRule YAML itself:
#   1. PromQL range-vector syntax needs literal `[5m]` right next to templated
#      output - `[[ $w ]]` next to a literal `[` creates a 3-bracket run
#      ([[[) that Go's template lexer misparses.
#   2. Sloth's OWN templating syntax (`{{.window}}`, required literally inside
#      every errorQuery/totalQuery - see prometheusservicelevel.yaml) must
#      reach the rendered PrometheusServiceLevel completely untouched, for
#      Sloth's controller to substitute per-window at generation time - not
#      for this templating pass to consume. `{{ }}` is exactly Go's default
#      delimiter, so it has to be something else; `<< >>` also happens to
#      dodge Grafana dashboard JSON's legacy `[[var]]` substitution syntax,
#      which `[[ ]]` would not.
#
# Live-verified quirk (kind-dev, 2026-08-13): `kubectl get functions.pkg.
# crossplane.io function-go-templating-slo` shows Healthy: False - "cannot
# resolve package dependencies: ... node xpkg.crossplane.io/crossplane-contrib/
# function-go-templating already exists" - Crossplane's package-manager lock
# graph objects to two Function objects pointing at the identical package
# reference as the existing `function-go-templating`. Confirmed functionally
# harmless: the runtime pod comes up and the pipeline step executes correctly
# regardless (proven end-to-end, both on the original hand-rolled version and
# again on this Sloth-wrapping version). Cosmetic package-manager bookkeeping
# only, not a functional blocker - not otherwise fixed/worked around this pass.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: slos.catalog.idp.io
spec:
  compositeTypeRef:
    apiVersion: catalog.idp.io/v1alpha1
    kind: SLO
  mode: Pipeline
  pipeline:
    - step: render-slo-resources
      functionRef:
        name: function-go-templating-slo
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: FileSystem
        fileSystem:
          dirPath: /templates
        delims:
          left: "<<"
          right: ">>"
    - step: detect-ready
      functionRef:
        name: function-auto-ready
