apiVersion: catalog.idp.io/v1alpha1
kind: SLO
metadata:
  name: bad-slo
  namespace: demo-apps
spec:
  environmentRef:
    name: checkout-kind-dev-prod
  service: checkout-api
  objective: 99.9
  window: 30d
  indicator:
    type: availability
    metric: http_requests_total
    totalFilter: 'service="checkout-api"'
    # errorFilter deliberately omitted - exercises the template's fail() guard
    # (the backstop for xrds/slo.yaml's CEL validation). Expected: render-local.sh
    # exits non-zero with "indicator.type=availability requires indicator.errorFilter".
