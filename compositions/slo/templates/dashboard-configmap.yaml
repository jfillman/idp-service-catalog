# Rendered by function-go-templating (source: Inline, see composition.yaml/
# build-composition.sh), using double-angle-bracket delimiters
# (see composition.yaml). `grafana_dashboard: "1"` label matches kube-prometheus-
# stack's Grafana sidecar config (label=grafana_dashboard, labelValue="1",
# searchNamespace=ALL - verified live), so this ConfigMap is auto-discovered
# regardless of which namespace the owning SLO XR (and therefore this
# ConfigMap) lands in. Sloth itself doesn't generate dashboards in its
# Kubernetes-controller/operator mode (confirmed against its Helm chart's
# deployment args - only `kubernetes-controller`, no dashboard-related flag;
# dashboard generation is a separate CLI-only feature) - this ConfigMap is
# still ours to render.
#
# NOTE: never write two literal `<` or `>` characters adjacent to each other
# anywhere in this file outside a real action, including in comments - the
# lexer scans raw text for the delimiter pair regardless of YAML comment
# syntax, and an accidental empty action fails the whole render.
#
# The dashboard JSON below is static literal text with small single-line
# substitutions piped through toJson - never raw interpolation into a
# hand-quoted JSON string, since service/slo values containing a literal quote
# character would otherwise break the JSON. Keeping the surrounding JSON
# structure itself static (not built as a nested Sprig dict) avoids YAML
# block-scalar indentation risk entirely, since none of the substitutions
# introduce their own newlines.
#
# Metric names/labels below are Sloth's own (confirmed live against a real
# generated PrometheusRule, not guessed from docs - Sloth's docs site didn't
# actually document these): `sloth_slo`/`sloth_service` identify the series
# (deliberately NOT `sloth_id`, which is derived from the
# PrometheusServiceLevel object's own name - prometheusservicelevel.yaml
# names that object `<xrName>-slo`, an implementation detail this dashboard
# shouldn't need to know about). `slo:sli_error:ratio_rate5m` is the 5m SLI
# error ratio; `slo:objective:ratio` and `slo:period_error_budget_remaining:
# ratio` are Sloth's own metadata recording rules - the budget-remaining one
# in particular replaces a hand-rolled formula the previous (pre-Sloth)
# version of this template computed itself.
#
# Datasource `uid: "prometheus"` confirmed live against a real Grafana
# instance (kube-prometheus-stack's bundled default datasource).
<<- $spec := .observed.composite.resource.spec >>
<<- $xrName := .observed.composite.resource.metadata.name >>
<<- $service := $spec.service >>
<<- $sliExpr := printf "(1 - slo:sli_error:ratio_rate5m{sloth_slo=%q,sloth_service=%q}) * 100" $xrName $service >>
<<- $objectiveExpr := printf "slo:objective:ratio{sloth_slo=%q,sloth_service=%q} * 100" $xrName $service >>
<<- $budgetExpr := printf "slo:period_error_budget_remaining:ratio{sloth_slo=%q,sloth_service=%q} * 100" $xrName $service >>
<<- $title := printf "SLO: %s (%s)" $service $xrName >>
<<- $uid := printf "slo-%s" $xrName >>
apiVersion: v1
kind: ConfigMap
metadata:
  name: <<$xrName>>-slo-dashboard
  labels:
    grafana_dashboard: "1"
  annotations:
    <<setResourceNameAnnotation "dashboard-configmap">>
data:
  <<$xrName>>.json: |
    {
      "id": null,
      "uid": <<$uid | toJson>>,
      "title": <<$title | toJson>>,
      "tags": ["slo", <<$service | toJson>>],
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 0,
      "timezone": "browser",
      "refresh": "1m",
      "time": { "from": "now-7d", "to": "now" },
      "templating": { "list": [] },
      "annotations": { "list": [] },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "SLI over time",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "custom": { "drawStyle": "line", "lineWidth": 1, "fillOpacity": 10 }
            },
            "overrides": []
          },
          "targets": [
            { "refId": "A", "expr": <<$sliExpr | toJson>>, "legendFormat": "SLI (5m)" },
            { "refId": "B", "expr": <<$objectiveExpr | toJson>>, "legendFormat": "Objective" }
          ]
        },
        {
          "id": 2,
          "type": "gauge",
          "title": "Error budget remaining",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 20 },
                  { "color": "green", "value": 50 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            { "refId": "A", "expr": <<$budgetExpr | toJson>> }
          ]
        }
      ]
    }
