# Real Crossplane extra-resources lookup against the cluster registry
# (gitops-cluster-dev/00-bootstrap/cluster-registry/, service-catalog-design.md §0) -
# moved verbatim (mechanism unchanged) from nodejsapplication's own
# 00-devcluster-gate.yaml, which springbootapplication's own copy already ported
# byte-for-byte before this extraction. See that file's own git history for the
# full "why" - $tenantsRepo comes from registry data, not a hardcoded literal,
# because kind-dev's tenants repo is a legacy name that breaks the
# gitops-cluster-<cluster>-tenants convention every upper cluster uses.
#
# $xrName here is $spec.appName (the OWNING app's name, passed in by the parent
# XR), not this XR's own metadata.name - TektonCICD is a distinct composed
# resource with its own name, but tenants/<app>/identity.yaml is keyed on the
# app's name, not this resource's.
#
# $clusterOk/$xrName/$devCluster/$tenantsRepo are declared once here, not
# redeclared per file below - Go template variables declared at this
# (unindented) scope persist for the rest of THIS pipeline step's execution
# across the --- separators. tektoncicd-status/status.yaml is a SEPARATE
# pipeline step (its own template execution scope) and redeclares this same
# lookup itself.
#
# Deliberately ONE YAML document in this file, not two - computing everything
# up front via template actions with no literal output, before the
# ExtraResources document itself, avoids an untested "does function-go-templating
# tolerate a blank rendered document" question entirely.
<<- $xrName := .observed.composite.resource.spec.appName >>
<<- $spec := .observed.composite.resource.spec >>
<<- $devCluster := $spec.devCluster >>
<<- $allExtra := .extraResources | default dict >>
<<- $entry := index $allExtra "devcluster-registry-entry" | default dict >>
<<- $items := index $entry "items" | default list >>
<<- $clusterOk := false >>
<<- $clusterType := "" >>
<<- $cicdReady := "" >>
<<- $tenantsRepo := "" >>
<<- if gt (len $items) 0 >>
  <<- $cm := (index $items 0).resource >>
  <<- $clusterType = $cm.data.type >>
  <<- $cicdReady = index $cm.data "cicdReady" | default "" >>
  <<- $tenantsRepo = index $cm.data "tenantsRepo" | default "" >>
  <<- if and (eq $clusterType "dev") (eq $cicdReady "true") >>
    <<- $clusterOk = true >>
  <<- end >>
<<- end >>
apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
kind: ExtraResources
requirements:
  devcluster-registry-entry:
    apiVersion: v1
    kind: ConfigMap
    namespace: crossplane-system
    matchName: <<$devCluster>>
