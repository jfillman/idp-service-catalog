# Real Crossplane extra-resources lookup against the cluster registry
# (gitops-cluster-dev/00-bootstrap/cluster-registry/, service-catalog-design.md §0) -
# same `matchName` pattern applicationenvironment's own 00-cluster-gate.yaml and
# nodejsapplication's own 00-devcluster-gate.yaml already use, added here 2026-08-18.
#
# Replaces what used to be a plain `eq $spec.cluster "kind-dev"` string comparison in
# each of this directory's three resource files (clustersecretstore.yaml,
# infisicalproject.yaml, per-env-secretstore.yaml) - a prior session deliberately chose
# that static comparison over a live lookup, reasoning "which cluster hosts Infisical
# is a static topology fact... today: only ever kind-dev" (see this catalog's own git
# history). That reasoning assumed a single permanent dev cluster; the fleet now
# supports multiple, which breaks it: a SECOND dev cluster is still type: dev but does
# NOT physically run Infisical (idp/docs/service-catalog-design.md Item 8 deliberately
# keeps one shared Infisical instance, not one per dev cluster - "second Infisical
# instance per cluster" was weighed and rejected for the extra live infra cost). A
# plain type: dev check would incorrectly route it to local Kubernetes Auth against an
# Infisical that isn't running there. `infisicalHost` is a separate, independent
# registry field from `type` for exactly this reason - see kind-dev.yaml's own header.
#
# Declared once here (this Composition's single function-go-templating pipeline step
# concatenates every templates/*.yaml file into one template execution - see
# build-composition.sh - so $isInfisicalHost below is available to every later file in
# this same directory without redeclaring the ExtraResources requirement itself,
# matching 00-cluster-gate.yaml's own "declared once, persists across --- separators"
# convention). Each resource file still redeclares its own $spec locally, matching this
# Composition's existing per-file convention (infisicalproject.yaml/
# clustersecretstore.yaml/per-env-secretstore.yaml each already redeclare $spec/
# $appName/$envSlug/$projectSlug independently, even within this same step).
#
# Behavior-preserving for any cluster name that ISN'T registered at all (a typo, or a
# cluster mid-onboarding before its registry entry lands): $items stays empty,
# $isInfisicalHost stays false, exactly matching the ORIGINAL code's "anything other
# than the literal kind-dev" fallback to Universal Auth - no new hard gate introduced,
# unlike ApplicationEnvironment/NodeJSApplication's own registry gates which refuse to
# render entirely. This Composition still makes no OTHER cross-cluster call (xrds/
# secretstore.yaml's own header) - this lookup is local-cluster-only, same as
# ApplicationEnvironment's and NodeJSApplication's.
<<- $spec := .observed.composite.resource.spec >>
<<- $allExtra := .extraResources | default dict >>
<<- $entry := index $allExtra "cluster-registry-entry" | default dict >>
<<- $items := index $entry "items" | default list >>
<<- $isInfisicalHost := false >>
<<- if gt (len $items) 0 >>
  <<- $cm := (index $items 0).resource >>
  <<- $infisicalHost := index $cm.data "infisicalHost" | default "" >>
  <<- if eq $infisicalHost "true" >>
    <<- $isInfisicalHost = true >>
  <<- end >>
<<- end >>
apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
kind: ExtraResources
requirements:
  cluster-registry-entry:
    apiVersion: v1
    kind: ConfigMap
    namespace: crossplane-system
    matchName: <<$spec.cluster>>
---
