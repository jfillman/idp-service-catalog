# Rendered by function-go-templating (source: Inline, see composition.yaml/
# build-composition.sh).
#
# spec.provider.infisical schema confirmed against ESO's own vendored CRD
# (10-crds-operators/external-secrets/, chart pin 2.8.0 - the exact provider block
# shape, incl. secretsScope.{projectSlug,environmentSlug,secretsPath} and
# auth.universalAuthCredentials.{clientId,clientSecret} as SecretKeySelectors, was
# checked directly against the vendored CRD source, not assumed from docs).
#
# hostAPI points at this cluster's own in-cluster Infisical Service - the default
# (https://app.infisical.com/api) is Infisical's SaaS, wrong for a self-hosted
# on-prem instance. clientId/clientSecret reference the credentials Secret
# InfisicalProject's operator writes (same namespace as this XR, hence this app's
# own namespace - see infisicalproject.yaml's credentialsSecretName) - that Secret
# doesn't exist yet on this store's very first reconcile (the operator writes it
# asynchronously, seconds after the InfisicalProject CR appears) - not a problem,
# same eventual-consistency shape as any other not-yet-ready secretKeyRef; ESO's
# own controller reports Ready:False until it resolves, then self-heals, no
# ordering/wait logic needed in this Composition.
#
# spec.conditions.namespaceRegexes restricts this store to exactly this app's own
# namespaces on this cluster (item 8's resolved scope: "cluster-scoped" doesn't mean
# "visible to every app") - app-<appName>-<env>, this catalog's live-confirmed
# namespace convention (kind-dev: app-checkout-api-dev, app-widget-api-dev; kind-prod:
# app-checkout-api-prod - checked directly via `kubectl get ns`, not assumed).
<<- $spec := .observed.composite.resource.spec >>
<<- $xrName := .observed.composite.resource.metadata.name >>
<<- $xrNamespace := .observed.composite.resource.metadata.namespace >>
<<- $appName := $spec.appRef.name >>
<<- $envSlug := $spec.environmentSlug | default "shared" >>
<<- $credsSecretName := printf "%s-infisical-creds" $xrName >>
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: <<$xrName>>
  annotations:
    <<setResourceNameAnnotation "cluster-secret-store">>
spec:
  conditions:
    - namespaceRegexes:
        - <<printf "^app-%s-.*$" $appName | toJson>>
  provider:
    infisical:
      hostAPI: "http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080/api"
      auth:
        universalAuthCredentials:
          clientId:
            name: <<$credsSecretName>>
            namespace: <<$xrNamespace>>
            key: clientId
          clientSecret:
            name: <<$credsSecretName>>
            namespace: <<$xrNamespace>>
            key: clientSecret
      secretsScope:
        projectSlug: <<$xrName>>
        environmentSlug: <<$envSlug>>
        secretsPath: "/"
---
