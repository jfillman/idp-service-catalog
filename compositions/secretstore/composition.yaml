# GENERATED FILE - do not hand-edit the pipeline's `input.inline.template`
# block below. Edit templates/*.yaml instead, then run ./build-composition.sh
# to regenerate this file. See compositions/slo/build-composition.sh for why
# this catalog uses `source: Inline` for every Composition rather than
# `source: FileSystem` against a shared mount.
#
# Renders an InfisicalProject CR (reconciled by infisical-secretstore-operator,
# gitops-cluster-dev/10-crds-operators/infisical-secretstore-operator/) and an ESO
# ClusterSecretStore pointed at the credentials that operator produces -
# idp/docs/service-catalog-design.md Item 8. NOT yet wired into
# ApplicationEnvironment's auto-provisioning (create-on-first-env, reference on
# later ones) - this XRD is standalone-creatable for this first pass, same as SLO
# was before any Attached-tier auto-provisioning existed. That wiring needs the
# idempotent-git-file-write mechanism discussed for the "N sibling XRs, one shared
# resource" problem - separate follow-up, deliberately not bolted on here.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: secretstores.catalog.idp.io
spec:
  compositeTypeRef:
    apiVersion: catalog.idp.io/v1alpha1
    kind: SecretStore
  mode: Pipeline
  pipeline:
    - step: render-secretstore-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            # Real Crossplane extra-resources lookup against the cluster registry
            # (gitops-cluster-dev/00-bootstrap/cluster-registry/, service-catalog-design.md §0) -
            # same `matchName` pattern applicationenvironment's own 00-cluster-gate.yaml and
            # nodejsapplication's own 00-devcluster-gate.yaml already use, added here 2026-08-18.
            #
            # Replaces what used to be a plain `eq $spec.cluster "kind-dev"` string comparison in
            # each of this directory's three resource files (clustersecretstore.yaml,
            # infisicalproject.yaml, per-env-secretstore.yaml) - a prior session deliberately chose
            # that static comparison over a live lookup, reasoning "which cluster hosts Infisical
            # is a static topology fact... today: only ever kind-dev" (see this catalog's own git
            # history). That reasoning assumed a single permanent dev cluster; the fleet now
            # supports multiple, which breaks it: a SECOND dev cluster is still type: dev but does
            # NOT physically run Infisical (idp/docs/service-catalog-design.md Item 8 deliberately
            # keeps one shared Infisical instance, not one per dev cluster - "second Infisical
            # instance per cluster" was weighed and rejected for the extra live infra cost). A
            # plain type: dev check would incorrectly route it to local Kubernetes Auth against an
            # Infisical that isn't running there. `infisicalHost` is a separate, independent
            # registry field from `type` for exactly this reason - see kind-dev.yaml's own header.
            #
            # Declared once here (this Composition's single function-go-templating pipeline step
            # concatenates every templates/*.yaml file into one template execution - see
            # build-composition.sh - so $isInfisicalHost below is available to every later file in
            # this same directory without redeclaring the ExtraResources requirement itself,
            # matching 00-cluster-gate.yaml's own "declared once, persists across --- separators"
            # convention). Each resource file still redeclares its own $spec locally, matching this
            # Composition's existing per-file convention (infisicalproject.yaml/
            # clustersecretstore.yaml/per-env-secretstore.yaml each already redeclare $spec/
            # $appName/$envSlug/$projectSlug independently, even within this same step).
            #
            # Behavior-preserving for any cluster name that ISN'T registered at all (a typo, or a
            # cluster mid-onboarding before its registry entry lands): $items stays empty,
            # $isInfisicalHost stays false, exactly matching the ORIGINAL code's "anything other
            # than the literal kind-dev" fallback to Universal Auth - no new hard gate introduced,
            # unlike ApplicationEnvironment/NodeJSApplication's own registry gates which refuse to
            # render entirely. This Composition still makes no OTHER cross-cluster call (xrds/
            # secretstore.yaml's own header) - this lookup is local-cluster-only, same as
            # ApplicationEnvironment's and NodeJSApplication's.
            <<- $spec := .observed.composite.resource.spec >>
            <<- $allExtra := .extraResources | default dict >>
            <<- $entry := index $allExtra "cluster-registry-entry" | default dict >>
            <<- $items := index $entry "items" | default list >>
            <<- $isInfisicalHost := false >>
            <<- if gt (len $items) 0 >>
              <<- $cm := (index $items 0).resource >>
              <<- $infisicalHost := index $cm.data "infisicalHost" | default "" >>
              <<- if eq $infisicalHost "true" >>
                <<- $isInfisicalHost = true >>
              <<- end >>
            <<- end >>
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              cluster-registry-entry:
                apiVersion: v1
                kind: ConfigMap
                namespace: crossplane-system
                matchName: <<$spec.cluster>>
            ---
            ---
            # Rendered by function-go-templating (source: Inline, see composition.yaml/
            # build-composition.sh).
            #
            # Wrapped in an objects.kubernetes.m.crossplane.io Object (provider-kubernetes),
            # NOT composed as a first-class ClusterSecretStore directly - confirmed live:
            # Crossplane v2 rejects composing a cluster-scoped native resource from a
            # namespaced XR ("cannot apply cluster scoped composed resource... for a namespaced
            # composite resource"), the exact same restriction NodeJSApplication's own
            # provider-github already hit for Cluster-scoped repo resources - same fix, the
            # namespaced managed-resource family (kubernetes.m.crossplane.io, not
            # kubernetes.crossplane.io), wrapping the actual manifest inside
            # spec.forProvider.manifest instead. See 10-crds-operators/crossplane/
            # provider-kubernetes-config.yaml for the ClusterProviderConfig + RBAC this needed
            # (neither existed before this Composition needed them).
            #
            # spec.provider.infisical schema (inside the wrapped manifest) confirmed against
            # ESO's real upstream Go source (apis/externalsecrets/v1/secretsstore_infisical_types.go),
            # not the vendored CRD's own docs comments - auth.kubernetesAuthCredentials.identityId
            # is a SecretKeySelector (same shape as universalAuthCredentials was), and the
            # optional serviceAccountTokenPath field is deliberately left unset below: confirmed
            # against providers/v1/infisical/provider.go that an unset value makes ESO's
            # controller present ITS OWN in-pod projected SA token to Infisical's login, not
            # read anything from a Secret - the actual zero-persisted-credential mechanism, not
            # just a marketing claim.
            #
            # hostAPI points at this cluster's own in-cluster Infisical Service - the default
            # (https://app.infisical.com/api) is Infisical's SaaS, wrong for a self-hosted
            # on-prem instance. identityId references the credentials Secret InfisicalProject's
            # operator writes (same namespace as this XR, hence this app's own namespace - see
            # infisicalproject.yaml's credentialsSecretName) - that Secret doesn't exist yet on
            # this store's very first reconcile (the operator writes it asynchronously, seconds
            # after the InfisicalProject CR appears) - not a problem, same eventual-consistency
            # shape as any other not-yet-ready secretKeyRef; ESO's own controller reports
            # Ready:False until it resolves, then self-heals, no ordering/wait logic needed in
            # this Composition. Unlike the old universalAuthCredentials.clientSecret, what's in
            # that Secret (identityId) isn't itself sensitive - see infisicalproject.yaml's own
            # credentialsSecretName description for why.
            #
            # spec.conditions.namespaceRegexes restricts this store to exactly this app's own
            # namespaces on this cluster (item 8's resolved scope: "cluster-scoped" doesn't mean
            # "visible to every app") - app-<appName>-<env>, this catalog's live-confirmed
            # namespace convention (kind-dev: app-checkout-api-dev, app-widget-api-dev; kind-prod:
            # app-checkout-api-prod - checked directly via `kubectl get ns`, not assumed).
            #
            # ONLY rendered in "shared" mode (environmentSlug == "shared") - the wide-open store
            # covering every env namespace for this (app, cluster) pair. See
            # per-env-secretstore.yaml for the narrowed, per-env sibling.
            #
            # $projectSlug computed from spec fields, not this XR's own name - see
            # infisicalproject.yaml's header for why. This store's own object NAME is also
            # $projectSlug (not $xrName) - deliberate: a per-env XR (per-env-secretstore.yaml)
            # computes and creates ITS OWN differently-named ClusterSecretStore, and the two
            # must never collide.
            #
            # hostAPI/authMethod both branch on $isInfisicalHost (00-infisical-host-gate.yaml,
            # same pipeline step - see that file's own header for why this is a live cluster-
            # registry lookup now, not the plain string comparison this used to be). The
            # Infisical-host branch is this cluster's own in-cluster Service DNS (Infisical and
            # every workload calling it are the same cluster there). The other branch is
            # a real, live-verified NodePort address (infisical-nodeport.yaml, same directory as
            # this operator's other deploy manifests) - a kind-cluster-local-sandbox stand-in for
            # what a real routable endpoint would be between genuinely separate clusters; flagged
            # there, not repeated here.
            <<- $spec := .observed.composite.resource.spec >>
            <<- $xrNamespace := .observed.composite.resource.metadata.namespace >>
            <<- $appName := $spec.appRef.name >>
            <<- $envSlug := $spec.environmentSlug | default "shared" >>
            <<- $projectSlug := printf "%s-%s" $appName $spec.cluster >>
            <<- $credsSecretName := printf "%s-infisical-creds" $projectSlug >>
            <<- $hostAPI := "http://10.89.0.5:31800/api" >>
            <<- $authMethod := "universal" >>
            <<- if $isInfisicalHost >>
              <<- $hostAPI = "http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080/api" >>
              <<- $authMethod = "kubernetes" >>
            <<- end >>
            <<- if eq $envSlug "shared" >>
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: <<$projectSlug>>
              annotations:
                <<setResourceNameAnnotation "cluster-secret-store">>
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ClusterSecretStore
                  metadata:
                    name: <<$projectSlug>>
                  spec:
                    conditions:
                      - namespaceRegexes:
                          - <<printf "^app-%s-.*$" $appName | toJson>>
                    provider:
                      infisical:
                        hostAPI: <<$hostAPI | toJson>>
                        auth:
                          <<- if eq $authMethod "kubernetes" >>
                          kubernetesAuthCredentials:
                            identityId:
                              name: <<$credsSecretName>>
                              namespace: <<$xrNamespace>>
                              key: identityId
                            # serviceAccountTokenPath deliberately omitted - see this file's
                            # header. ESO presents its own controller SA token, not a stored one.
                          <<- else >>
                          universalAuthCredentials:
                            clientId:
                              name: <<$credsSecretName>>
                              namespace: <<$xrNamespace>>
                              key: clientId
                            clientSecret:
                              name: <<$credsSecretName>>
                              namespace: <<$xrNamespace>>
                              key: clientSecret
                          <<- end >>
                        secretsScope:
                          projectSlug: <<$projectSlug>>
                          environmentSlug: shared
                          secretsPath: "/"
              managementPolicies: ["*"]
            <<- end >>
            ---
            ---
            # Rendered by function-go-templating (source: Inline, see composition.yaml/
            # build-composition.sh), double-angle-bracket delimiters (no PromQL/Sloth-syntax
            # collision reason here like the SLO Composition has, but kept consistent with this
            # catalog's one other Inline-mode Composition rather than introducing a second
            # delimiter convention for no reason).
            #
            # NOTE: never write two literal delimiter characters adjacent to each other
            # anywhere in this file outside a real action, including in comments - the lexer
            # scans raw text for the pair regardless of YAML comment syntax, and an accidental
            # empty action fails the whole render (hit this live building this exact file).
            #
            # ONLY rendered in "shared" mode (environmentSlug == "shared", the default) - a
            # non-"shared" XR references this project by its own computed $projectSlug (below)
            # but never creates one; see per-env-secretstore.yaml for that mode.
            #
            # $projectSlug is computed from spec fields (appRef.name + cluster), NOT from this
            # XR's own metadata.name - a deliberate change from this XRD's first pass (which
            # used $xrName directly, back when only one XR ever existed per (app,cluster)). Both
            # modes now need the SAME formula so a per-env XR (a DIFFERENT k8s object, DIFFERENT
            # name) can compute the identical project slug its "shared" sibling already created,
            # with no ExtraResources lookup needed either way.
            #
            # authMethod: now an ExtraResources cluster-registry lookup after all (2026-08-18) -
            # a real reversal of this file's own prior reasoning. That reasoning was "which
            # cluster hosts Infisical is a static topology fact (today: only ever kind-dev)" -
            # true only as long as exactly one dev cluster could ever exist. The fleet now
            # supports multiple; a second dev cluster is still type: dev but does NOT physically
            # run Infisical (idp/docs/service-catalog-design.md Item 8 deliberately keeps one
            # shared Infisical instance, not one per dev cluster), so "is this cluster dev-typed"
            # and "does this cluster host Infisical" are no longer the same fact - see
            # 00-infisical-host-gate.yaml (same pipeline step) for the live lookup against the
            # registry's own `infisicalHost` field, and kind-dev.yaml's own header for why that's
            # a separate field from `type`. See idp/docs/service-catalog-design.md Item 8's
            # multi-cluster revision for the original reasoning this builds on (Kubernetes Auth
            # needs Infisical and the workload on the SAME cluster; every cluster that isn't the
            # Infisical host needs Universal Auth instead - Gateway mode, the alternative, is
            # Enterprise-only).
            <<- $spec := .observed.composite.resource.spec >>
            <<- $appName := $spec.appRef.name >>
            <<- $envSlug := $spec.environmentSlug | default "shared" >>
            <<- $projectSlug := printf "%s-%s" $appName $spec.cluster >>
            <<- $authMethod := "universal" >>
            <<- if $isInfisicalHost >>
              <<- $authMethod = "kubernetes" >>
            <<- end >>
            <<- if eq $envSlug "shared" >>
            apiVersion: secrets.idp.io/v1alpha1
            kind: InfisicalProject
            metadata:
              name: <<$projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-project">>
            spec:
              projectName: <<$projectSlug>>
              slug: <<$projectSlug>>
              environmentSlug: shared
              credentialsSecretName: <<printf "%s-infisical-creds" $projectSlug>>
              authMethod: <<$authMethod>>
            <<- end >>
            ---
            ---
            # ONLY rendered in per-env mode (environmentSlug != "shared"). Does NOT create a
            # project - references the ALREADY-existing one from this (app, cluster) pair's
            # "shared" XR via the SAME computed $projectSlug formula (infisicalproject.yaml's
            # header) - no ExtraResources lookup needed, since idp-application's own
            # attached/secretstore.yaml always renders the "shared" XR alongside any per-env one,
            # in the SAME chart release, same namespace. If the "shared" XR's own InfisicalProject
            # hasn't finished creating that project yet, InfisicalEnvironment's own reconcile
            # below just waits (TemporaryError) - the same eventual-consistency shape every other
            # not-yet-ready reference in this catalog already uses, no ordering logic needed here.
            #
            # InfisicalEnvironment (a second CRD this same operator reconciles,
            # secrets.idp.io/v1alpha1 - see its own CRD file's header) just ensures ONE
            # additional environment exists in that project. The credentials Secret this store's
            # auth block references is the SAME one the "shared" XR's InfisicalProject wrote -
            # both XRs live in the same namespace (idp-application's own convention: this chart
            # renders every SecretStore-family XR for one (app, cluster) pair into one dedicated
            # namespace - see that chart's own attached/secretstore.yaml), so a same-namespace
            # secretKeyRef is correct without this Composition needing to know that convention
            # by name.
            <<- $spec := .observed.composite.resource.spec >>
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $xrNamespace := .observed.composite.resource.metadata.namespace >>
            <<- $appName := $spec.appRef.name >>
            <<- $envSlug := $spec.environmentSlug | default "shared" >>
            <<- $projectSlug := printf "%s-%s" $appName $spec.cluster >>
            <<- $credsSecretName := printf "%s-infisical-creds" $projectSlug >>
            <<- $hostAPI := "http://10.89.0.5:31800/api" >>
            <<- $authMethod := "universal" >>
            <<- if $isInfisicalHost >>
              <<- $hostAPI = "http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080/api" >>
              <<- $authMethod = "kubernetes" >>
            <<- end >>
            <<- if ne $envSlug "shared" >>
            apiVersion: secrets.idp.io/v1alpha1
            kind: InfisicalEnvironment
            metadata:
              name: <<$xrName>>
              annotations:
                <<setResourceNameAnnotation "infisical-environment">>
            spec:
              projectSlug: <<$projectSlug>>
              environmentSlug: <<$envSlug>>
            ---
            apiVersion: kubernetes.m.crossplane.io/v1alpha1
            kind: Object
            metadata:
              name: <<$xrName>>
              annotations:
                <<setResourceNameAnnotation "per-env-cluster-secret-store">>
            spec:
              forProvider:
                manifest:
                  apiVersion: external-secrets.io/v1
                  kind: ClusterSecretStore
                  metadata:
                    name: <<$xrName>>
                  spec:
                    conditions:
                      # Narrowed to exactly ONE namespace (not the "shared" store's wildcard) -
                      # the real per-env isolation this mode exists for: an ExternalSecret
                      # anywhere else can't even resolve this store, regardless of what its own
                      # remoteRef says.
                      - namespaceRegexes:
                          - <<printf "^app-%s-%s$" $appName $envSlug | toJson>>
                    provider:
                      infisical:
                        hostAPI: <<$hostAPI | toJson>>
                        auth:
                          <<- if eq $authMethod "kubernetes" >>
                          kubernetesAuthCredentials:
                            identityId:
                              name: <<$credsSecretName>>
                              namespace: <<$xrNamespace>>
                              key: identityId
                          <<- else >>
                          universalAuthCredentials:
                            clientId:
                              name: <<$credsSecretName>>
                              namespace: <<$xrNamespace>>
                              key: clientId
                            clientSecret:
                              name: <<$credsSecretName>>
                              namespace: <<$xrNamespace>>
                              key: clientSecret
                          <<- end >>
                        secretsScope:
                          projectSlug: <<$projectSlug>>
                          environmentSlug: <<$envSlug>>
                          secretsPath: "/"
              managementPolicies: ["*"]
            <<- end >>
            ---
            ---
        delims:
          left: "<<"
          right: ">>"
    - step: detect-ready
      functionRef:
        name: function-auto-ready
