            <<- $appName := $spec.appRef.name >>
            <<- $envSlug := $spec.environmentSlug | default "shared" >>
            <<- $projectSlug := printf "%s-%s" $appName $spec.cluster >>
            <<- $authMethod := "universal" >>
            <<- if eq $spec.cluster "kind-dev" >>
              <<- $authMethod = "kubernetes" >>
            <<- end >>
            <<- if eq $envSlug "shared" >>
            apiVersion: secrets.idp.io/v1alpha1
            kind: InfisicalProject
            metadata:
              name: <<$projectSlug>>
              annotations:
                <<setResourceNameAnnotation "infisical-project">>
            spec:
              projectName: <<$projectSlug>>
              slug: <<$projectSlug>>
              environmentSlug: shared
              credentialsSecretName: <<printf "%s-infisical-creds" $projectSlug>>
              authMethod: <<$authMethod>>
