            <<- $xrNamespace := .observed.composite.resource.metadata.namespace >>
            <<- $appName := $spec.appRef.name >>
            <<- $envSlug := $spec.environmentSlug | default "shared" >>
            <<- $projectSlug := printf "%s-%s" $appName $spec.cluster >>
            <<- $credsSecretName := printf "%s-infisical-creds" $projectSlug >>
            <<- $hostAPI := "http://10.89.0.2:31800/api" >>
            <<- $authMethod := "universal" >>
            <<- if eq $spec.cluster "kind-dev" >>
              <<- $hostAPI = "http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080/api" >>
              <<- $authMethod = "kubernetes" >>
