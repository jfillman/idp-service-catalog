                          projectSlug: <<$projectSlug>>
                          environmentSlug: <<$envSlug>>
                          secretsPath: "/"
              managementPolicies: ["*"]
            <<- end >>
            ---
            ---
        delims:
          left: "<<"
          right: ">>"
    - step: detect-ready
      functionRef:
        name: function-auto-ready
