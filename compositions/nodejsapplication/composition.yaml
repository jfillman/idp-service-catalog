# GENERATED FILE - do not hand-edit the pipeline's `input.inline.template` blocks
# below. Edit templates/render-github-resources/*.yaml or
# templates/cicd-onboarding-status/*.yaml instead, then run ./build-composition.sh to
# regenerate this file.
#
# Two function-go-templating steps, not one (compositions/slo's own pattern, extended):
# render-github-resources composes the real provider-github managed resources (Repository/
# RepositoryFile - see idp/docs/service-catalog-design.md §1), cicd-onboarding-status
# patches the XR's own status afterward to force Ready: False with a clear reason (see
# that template's own header for the mechanism and why). Both share the ONE
# already-installed function-go-templating Function via source: Inline - registering a
# second Function package pointing at the same reference corrupted Crossplane's shared
# dependency-lock graph cluster-wide, a real bug hit live building the SLO Composition
# (see compositions/slo/build-composition.sh's own header) - never repeat that here.
#
# Delimiters: << >> instead of Go's default {{ }}, matching compositions/slo - kept
# consistent across this catalog's Compositions even though this one has no PromQL/Sloth
# templating syntax of its own to dodge; `<<setResourceNameAnnotation ...>>` calls
# below are function-go-templating's own helper, unaffected by the delimiter choice.
apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: nodejsapplications.catalog.idp.io
spec:
  compositeTypeRef:
    apiVersion: catalog.idp.io/v1alpha1
    kind: NodeJSApplication
  mode: Pipeline
  pipeline:
    - step: render-github-resources
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            # Real Crossplane extra-resources lookup against the cluster registry
            # (gitops-cluster-dev/00-bootstrap/cluster-registry/, service-catalog-design.md §0) -
            # same mechanism/pattern as applicationenvironment's own 00-cluster-gate.yaml, adapted
            # here now that spec.devCluster is real and required (2026-08-18): this XRD used to be
            # permanently centralized on a hardcoded "kind-dev" (see this Composition's own git
            # history), correct only as long as exactly one dev cluster ever existed. The fleet now
            # supports multiple - an app is pinned to exactly one via spec.devCluster, and THIS
            # gate is what validates that choice live rather than trusting the string blindly.
            #
            # type: dev + cicdReady: "true" (not type: upper + crossplaneReady, which
            # ApplicationEnvironment's own gate checks) - a dev cluster is defined by running
            # platform-cicd's control plane, and cicdReady is exactly the field that flips true
            # once that's GitOps-managed and live-verified on a given cluster (see kind-dev.yaml's
            # own history).
            #
            # $clusterOk/$xrName/$devCluster/$tenantsRepo are declared once here, not redeclared
            # per file below - Go template variables declared at this (unindented) scope persist
            # for the rest of THIS pipeline step's execution across the --- separators (same
            # concatenated-template convention 00-cluster-gate.yaml's own header documents).
            # cicd-onboarding-status/status.yaml is a SEPARATE pipeline step (its own template
            # execution scope) and redeclares this same lookup itself, same as
            # applicationenvironment/templates/status/status.yaml does for its own gate.
            #
            # $tenantsRepo now comes from the registry entry's own data.tenantsRepo, not a
            # hardcoded "gitops-cluster-dev-tenants" literal - kind-dev's tenants repo is a legacy
            # name that breaks the gitops-cluster-<cluster>-tenants convention every upper cluster
            # uses (renaming the real, live repo was out of scope - too disruptive to already-wired
            # ArgoCD Applications). Recorded as registry data instead so a future second dev
            # cluster can follow the clean convention without another hardcoded exception here.
            #
            # Deliberately ONE YAML document in this file, not two - see 00-cluster-gate.yaml's own
            # header for why (computing everything up front via template actions with no literal
            # output, before the ExtraResources document itself, avoids an untested "does
            # function-go-templating tolerate a blank rendered document" question entirely).
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $spec := .observed.composite.resource.spec >>
            <<- $devCluster := $spec.devCluster >>
            <<- $allExtra := .extraResources | default dict >>
            <<- $entry := index $allExtra "devcluster-registry-entry" | default dict >>
            <<- $items := index $entry "items" | default list >>
            <<- $clusterOk := false >>
            <<- $clusterType := "" >>
            <<- $cicdReady := "" >>
            <<- $tenantsRepo := "" >>
            <<- if gt (len $items) 0 >>
              <<- $cm := (index $items 0).resource >>
              <<- $clusterType = $cm.data.type >>
              <<- $cicdReady = index $cm.data "cicdReady" | default "" >>
              <<- $tenantsRepo = index $cm.data "tenantsRepo" | default "" >>
              <<- if and (eq $clusterType "dev") (eq $cicdReady "true") >>
                <<- $clusterOk = true >>
              <<- end >>
            <<- end >>
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              devcluster-registry-entry:
                apiVersion: v1
                kind: ConfigMap
                namespace: crossplane-system
                matchName: <<$devCluster>>
            ---
            # Commits tenants/<app-name>/identity.yaml into this app's devCluster's own tenants
            # repo (today, for kind-dev: gitops-cluster-dev-tenants) - the ONE per-app tenant
            # identity file on this cluster (2026-08-18: absorbed app.yaml, which
            # used to sit right next to this file with an overlapping-but-not-identical field set -
            # see "identity.yaml absorbs app.yaml" below). Read by TWO independent ApplicationSets
            # now: platform-cicd's own tenant-onboarding ApplicationSet (charts/
            # platform-cicd-control-plane/templates/argocd/tenant-onboarding-applicationset.yaml,
            # .Values.tenantsRepoUrl, pointed here via hack/values-kind-dev.yaml) to stand up this
            # app's CICD pipeline (Tekton/PaC Application, RBAC, Triggers - see
            # platform-cicd/docs/onboarding.md's step 3), and idp's own tenant-appprojects
            # ApplicationSet (gitops-cluster-dev/02-argocd-apps/tenant-appprojects/) to build this
            # app's AppProject(s) - previously that second consumer read a separate tenants/<app>/
            # app.yaml, written by this same step (see git history for that file's own last
            # version). This is the real CICD-onboarding-commit step cicd-onboarding-status/
            # status.yaml's own header comment named as still-stubbed - built 2026-08-15 once
            # platform-cicd's control plane actually landed on kind-dev (see idp/docs/
            # service-catalog-design.md's NodeJSApplication note), redirected here from a
            # dedicated platform-cicd-kind-dev-tenants repo 2026-08-16 (see $tenantsRepo below).
            #
            # identity.yaml absorbs app.yaml (2026-08-18): the two files were "almost identical,
            # one a subset of the other," sitting side by side in the same commit - but NOT
            # byte-for-byte mergeable as-is, because their overlapping gitopsRepoUrl/appRepoUrl
            # fields deliberately held DIFFERENT string values. app.yaml's were .git-suffixed
            # (matching ArgoCD's own repoURL convention); identity.yaml's never were, because PaC
            # matches Repository CR spec.url against GitHub's webhook payload URL with an EXACT
            # string compare (pkg/matcher.MatchEventURLRepo, only trims a trailing slash), and that
            # payload URL never has .git - a shared .git-suffixed value broke PaC matching for
            # every app, confirmed live 2026-08-16 (checkout-api's first real push failed with
            # "cannot find a repository match"). Resolved by standardizing on ONE convention,
            # system-wide: no .git suffix anywhere (this file's own values were already correct;
            # ArgoCD's side is the one that changed - see gitops-cluster-dev's tenant-appprojects
            # ApplicationSet for why dropping .git there is safe, ArgoCD normalizes it away when
            # matching sourceRepos/repoURL, confirmed live during this same change). The
            # pre-existing hand-authored kind-observe identity.yaml (platform-cicd/tenants/
            # nodejs-demo-app/identity.yaml) never had .git here either - this restores that
            # convention rather than introducing a new one.
            #
            # $tenantsRepo (2026-08-16, redirected): previously a dedicated
            # platform-cicd-kind-dev-tenants repo, eliminated once live history showed it only ever
            # held throwaway verification apps and both platform-cicd/docs/onboarding.md and
            # idp/README.md confirmed kind-dev's platform-cicd instance is idp-exclusive (unlike
            # kind-observe, which hosts real, independent, non-idp tenants and keeps its own
            # platform-cicd.git-relative tenants/ - unaffected by this change). Confirmed live no
            # AppProject change is needed either: platform-onboarding's sourceRepos already
            # wildcards https://github.com/jfillman/*, and tenantsRepoUrl is only ever a generator
            # input, never gated by sourceRepos at all.
            #
            # 2026-08-18: $tenantsRepo/gate now come from 00-devcluster-gate.yaml (same pipeline
            # step, persists across this file) instead of a hardcoded "gitops-cluster-dev-tenants"
            # literal - this Bootstrap-tier XRD was "permanently centralized on kind-dev" only as
            # long as exactly one dev cluster existed; spec.devCluster is now real and required,
            # and this resource only renders once that cluster resolves live against the registry
            # (type: dev, cicdReady: "true") - see the gate file's own header.
            #
            # type: app (not infra) - NodeJSApplication only ever provisions regular applications,
            # never platform-adjacent services, so this is a fixed literal, not a spec field.
            # catalogNamespace: platform-catalog - fixed platform convention, matches every other
            # tenant's identity.yaml (platform-cicd/docs/onboarding.md step 3).
            #
            # All six platformIdentity fields are present even though platform-cicd's own docs allow
            # "" for unused ones - gitopsRepoUrl/appRepoUrl are always real here (NodeJSApplication
            # always provisions both repos), so there's nothing to leave empty.
            <<- $platformOwner := "jfillman" >>
            <<- $gitopsRepoUrl := printf "https://github.com/%s/gitops-%s" $platformOwner $xrName >>
            <<- $appRepoUrl := printf "https://github.com/%s/%s" $platformOwner $xrName >>
            <<- if $clusterOk >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-cicd-identity-yaml
              annotations:
                <<setResourceNameAnnotation "cicd-identity-yaml">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$tenantsRepo>>
                file: <<printf "tenants/%s/identity.yaml" $xrName>>
                overwriteOnCreate: true
                content: |
                  platformIdentity:
                    appName: <<$xrName>>
                    type: app
                    gitopsRepoUrl: <<$gitopsRepoUrl>>
                    appRepoUrl: <<$appRepoUrl>>
                    githubOwner: <<$platformOwner>>
                    catalogNamespace: platform-catalog
                commitMessage: <<printf "Onboard %s: add tenants/%s/identity.yaml for CICD pipeline onboarding" $xrName $xrName | toJson>>
            <<- end >>
            ---
            # Empty, scaffolded gitops-<app-name> repo - idp/docs/service-catalog-design.md Item 1/2:
            # "gitops-<app-name> gets created here, empty, rather than by item 3 [ApplicationEnvironment]
            # - its lifecycle is app-level (create once)". Just a README for now; the real
            # <cluster>/<env>/values.yaml layout gets populated once ApplicationEnvironment exists.
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $spec := .observed.composite.resource.spec >>
            <<- $visibility := $spec.visibility >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: Repository
            metadata:
              name: <<$xrName>>-gitops
              annotations:
                <<setResourceNameAnnotation "gitops-repo">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                name: <<printf "gitops-%s" $xrName>>
                description: <<printf "GitOps deployment repo for %s - <cluster>/<env>/values.yaml per environment" $xrName | toJson>>
                visibility: <<$visibility>>
                autoInit: true
            ---
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-gitops-readme
              annotations:
                <<setResourceNameAnnotation "gitops-repo-readme">>
            spec:
              # No "Update" - same fix, same reasoning as src-repo.yaml's own scaffold files
              # and applicationenvironment's values-yaml.yaml (which had the actual live bug,
              # 2026-08-18) - a scaffolded README a developer might reasonably edit shouldn't
              # get drift-corrected back to this static template.
              managementPolicies: ["Create", "Observe", "LateInitialize", "Delete"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<printf "gitops-%s" $xrName>>
                file: README.md
                overwriteOnCreate: true
                content: |
                  # gitops-<<$xrName>>

                  GitOps deployment repo for `<<$xrName>>`, scaffolded by `NodeJSApplication`
                  (idp-service-catalog). Empty until this app's first `ApplicationEnvironment`
                  resource is created - each environment gets its own `<cluster>/<env>/values.yaml`
                  here, rendered by `idp-application` (idp-service-catalog's shared Helm chart).
                commitMessage: "NodeJSApplication scaffold: README.md"
            ---
            # Commits a "shared"-mode SecretStore XR manifest into
            # tenants/<app-name>/xr-requests/secretstore.yaml - picked up by this app's own
            # devCluster's xr-requests ApplicationSet (gitops-cluster-dev/02-argocd-apps/
            # xr-requests/, for kind-dev), the SAME mechanism every other Bootstrap XR
            # already goes through, applied directly (no Helm release needed) into
            # app-<app-name>-cicd on that cluster.
            #
            # Real, deliberate correction of the original design (idp/docs/
            # service-catalog-design.md Item 8's second multi-cluster revision): secrets
            # infrastructure used to be an emergent side effect of idp-application's own
            # chart rendering an always-on SecretStore XR the first time some env actually
            # got deployed - meant "when does this exist" wasn't discoverable from the
            # Bootstrap XRD list at all, and tied provisioning to "someone happened to ship
            # a real release" rather than to onboarding itself. This is the fix: the SAME
            # unconditional, idempotent commit pattern cicd-identity-yaml.yaml already uses in
            # this same step - overwriteOnCreate:
            # true, deterministic content, no existence-check needed (a NodeJSApplication is
            # created exactly once per app, so there's no "N siblings" ownership question
            # here at all, unlike ApplicationEnvironment's own copy of this same idea).
            #
            # spec.devCluster, not a hardcoded "kind-dev" (2026-08-18): this is the app's OWN
            # dev-cluster secrets store, always exactly one, matching xrds/secretstore.yaml's
            # own "one shared environment for the dev cluster" scope (no per-env store on a
            # dev cluster - see that XRD's header for why). Which dev cluster is no longer a
            # Bootstrap-tier-wide constant - spec.devCluster is real and required (the fleet
            # now supports multiple dev clusters, an app pinned to exactly one) - $clusterOk/
            # $tenantsRepo come from 00-devcluster-gate.yaml (same pipeline step), which also
            # validates spec.devCluster live against the cluster registry before this
            # resource renders at all.
            <<- if $clusterOk >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-secretstore-xr
              annotations:
                <<setResourceNameAnnotation "secretstore-xr">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$tenantsRepo>>
                file: <<printf "tenants/%s/xr-requests/secretstore.yaml" $xrName>>
                overwriteOnCreate: true
                content: |
                  apiVersion: catalog.idp.io/v1alpha1
                  kind: SecretStore
                  metadata:
                    name: <<printf "%s-%s" $xrName $devCluster>>
                  spec:
                    appRef:
                      name: <<$xrName>>
                    cluster: <<$devCluster>>
                commitMessage: <<printf "Onboard %s: add tenants/%s/xr-requests/secretstore.yaml" $xrName $xrName | toJson>>
            <<- end >>
            ---
            # Src repo + Node.js boilerplate. Rendered by function-go-templating (source: Inline,
            # see ../composition.yaml/../build-composition.sh), using double-angle-bracket
            # delimiters (see composition.yaml) - same convention as compositions/slo, for the same
            # reason (Go's default curly-brace delimiter would collide with literal template syntax
            # elsewhere in this catalog; here it's package.json's own JSON braces needing no
            # escaping at all, kept consistent anyway).
            #
            # NOTE: never write two literal angle-bracket delimiter characters adjacent to each
            # other anywhere in this file outside a real action, including in comments - the lexer
            # scans raw text for the delimiter pair regardless of YAML comment syntax, and an
            # accidental empty action fails the whole render (hit live building this template).
            #
            # repo.github.m.upbound.io (namespaced managed resources), not the Cluster-scoped
            # repo.github.upbound.io family - see provider-github-config.yaml's own header for why
            # (Crossplane v2 refuses to let a namespaced XR compose a Cluster-scoped resource at
            # all, a real error hit live). providerConfigRef.kind: ClusterProviderConfig is
            # required, not defaulted - confirmed via `kubectl explain`.
            #
            # Repository's own forProvider has no owner field - every repo this ProviderConfig's
            # credential can create lands under whichever owner that credential is scoped to (see
            # ../../../10-crds-operators/crossplane/provider-github-config.yaml). autoInit: true on
            # every Repository below - RepositoryFile requires the target branch to already exist,
            # which an empty repo doesn't have.
            #
            # managementPolicies: ["Create", "Observe", "LateInitialize", "Delete"] (no "Update") on
            # every RepositoryFile below - deliberately different from applicationenvironment's
            # cluster-identity-yaml.yaml, which stays under full management (minus Delete) because
            # nothing but the composition should ever touch it. These five files (package.json, index.js,
            # Dockerfile, .gitignore, README.md) are the opposite: real app source a developer is
            # expected to edit immediately after scaffolding (add dependencies, write a test
            # script, ...). Under the provider's default "*" policy the controller drift-corrects
            # any such edit back to this static template on its next reconcile - a real bug hit
            # live (checkout-api's package.json got a "test" script and an express dependency
            # added, then silently reverted a couple minutes later, twice). Create-once-then-hands-off
            # is what "scaffold" is supposed to mean here.
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $spec := .observed.composite.resource.spec >>
            <<- $description := $spec.description | default (printf "%s - a Node.js application" $xrName) >>
            <<- $nodeVersion := $spec.nodeVersion >>
            <<- $packageManager := $spec.packageManager >>
            <<- $port := $spec.port >>
            <<- $visibility := $spec.visibility >>
            <<- $installCmd := "npm install" >>
            <<- $lockfile := "package-lock.json" >>
            <<- if eq $packageManager "pnpm" >>
              <<- $installCmd = "pnpm install --frozen-lockfile" >>
              <<- $lockfile = "pnpm-lock.yaml" >>
            <<- else if eq $packageManager "yarn" >>
              <<- $installCmd = "yarn install --frozen-lockfile" >>
              <<- $lockfile = "yarn.lock" >>
            <<- end >>
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: Repository
            metadata:
              name: <<$xrName>>-src
              annotations:
                <<setResourceNameAnnotation "src-repo">>
            spec:
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                name: <<$xrName>>
                description: <<$description | toJson>>
                visibility: <<$visibility>>
                autoInit: true
                hasIssues: true
                deleteBranchOnMerge: true
            ---
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-package-json
              annotations:
                <<setResourceNameAnnotation "src-repo-package-json">>
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize", "Delete"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: package.json
                overwriteOnCreate: true
                content: |
                  {
                    "name": <<$xrName | toJson>>,
                    "version": "0.1.0",
                    "description": <<$description | toJson>>,
                    "main": "index.js",
                    "scripts": {
                      "start": "node index.js"
                    },
                    "engines": {
                      "node": <<printf ">=%s" $nodeVersion | toJson>>
                    }
                  }
                commitMessage: "NodeJSApplication scaffold: package.json"
            ---
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-index-js
              annotations:
                <<setResourceNameAnnotation "src-repo-index-js">>
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize", "Delete"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: index.js
                overwriteOnCreate: true
                content: |
                  const http = require('http');

                  const port = process.env.PORT || <<$port>>;

                  const server = http.createServer((req, res) => {
                    if (req.url === '/healthz') {
                      res.writeHead(200, { 'Content-Type': 'application/json' });
                      res.end(JSON.stringify({ status: 'ok' }));
                      return;
                    }
                    res.writeHead(200, { 'Content-Type': 'text/plain' });
                    res.end(<<printf "Hello from %s\\n" $xrName | toJson>>);
                  });

                  server.listen(port, () => {
                    console.log(<<printf "%s listening on port ${port}" $xrName | toJson>>);
                  });
                commitMessage: "NodeJSApplication scaffold: index.js"
            ---
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-dockerfile
              annotations:
                <<setResourceNameAnnotation "src-repo-dockerfile">>
              # `apk upgrade` (picks up already-published Alpine package patches, e.g. libssl3/
              # libcrypto3) and removing npm's own bundled /usr/local/lib/node_modules/npm - real
              # HIGH-severity CVEs hit live scanning checkout-api's scaffolded image (brace-
              # expansion/cross-spawn/glob/minimatch/sigstore/tar), all traced to npm's own
              # internal dependency tree, not this app's (its own node_modules showed 0
              # findings throughout). node:*-alpine bundles a full npm install unconditionally,
              # regardless of $installCmd/$packageManager below - the running container only ever
              # execs `node`, never `npm`, so removing it after install is safe for the npm/pnpm/
              # yarn branches alike. Verified live: local podman build + trivy scan via the same
              # toolbox image image-scan.yaml uses, 20 HIGH findings -> 0.
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize", "Delete"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: Dockerfile
                overwriteOnCreate: true
                content: |
                  FROM node:<<$nodeVersion>>-alpine
                  WORKDIR /app
                  RUN apk upgrade --no-cache
                  COPY package.json <<$lockfile>>* ./
                  RUN <<$installCmd>> && \
                      rm -rf /usr/local/lib/node_modules/npm /usr/local/bin/npm /usr/local/bin/npx
                  COPY . .
                  EXPOSE <<$port>>
                  CMD ["node", "index.js"]
                commitMessage: "NodeJSApplication scaffold: Dockerfile"
            ---
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-gitignore
              annotations:
                <<setResourceNameAnnotation "src-repo-gitignore">>
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize", "Delete"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: .gitignore
                overwriteOnCreate: true
                content: |
                  node_modules/
                  .env
                  *.log
                commitMessage: "NodeJSApplication scaffold: .gitignore"
            ---
            apiVersion: repo.github.m.upbound.io/v1alpha1
            kind: RepositoryFile
            metadata:
              name: <<$xrName>>-src-readme
              annotations:
                <<setResourceNameAnnotation "src-repo-readme">>
            spec:
              managementPolicies: ["Create", "Observe", "LateInitialize", "Delete"]
              providerConfigRef:
                kind: ClusterProviderConfig
                name: default
              forProvider:
                repository: <<$xrName>>
                file: README.md
                overwriteOnCreate: true
                content: |
                  # <<$xrName>>

                  <<$description>>

                  Scaffolded by `NodeJSApplication` (idp-service-catalog). Node <<$nodeVersion>>,
                  <<$packageManager>>.

                  ```
                  <<$installCmd>>
                  npm start
                  ```

                  **CICD pipeline onboarding**: this app's `NodeJSApplication` resource carries a
                  `CicdOnboarded` condition tracking whether `platform-cicd`'s tenant-onboarding
                  ApplicationSet has picked up this app's committed tenant identity yet. See the
                  resource's own status for details.
                commitMessage: "NodeJSApplication scaffold: README.md"
            ---
        delims:
          left: "<<"
          right: ">>"
    - step: detect-ready
      functionRef:
        name: function-auto-ready
    - step: cicd-onboarding-status
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        inline:
          template: |
            # Surfaces the CICD-onboarding status as a custom condition, not an override of the
            # standard Ready condition - see xrds/nodejsapplication.yaml's own header and
            # idp/docs/service-catalog-design.md Item 1/2's "real known gap" note for what this was
            # and why. Ready itself stays real (whatever detect-ready, the pipeline step before this
            # one, computes from the actual provider-github managed resources): function-go-
            # templating's own docs (github.com/crossplane-contrib/function-go-templating,
            # "Setting Conditions on the Claim and Composite") explicitly reserve
            # Ready/Healthy/Synced and error if a Composition tries to set them directly via its
            # ClaimConditions mechanism - confirmed live, not guessed, after an earlier attempt at
            # patching status.conditions directly (matching the XR's own apiVersion/kind, no
            # composition-resource-name annotation - a real, but different, documented mechanism for
            # a different purpose) rendered with zero effect via crossplane render.
            #
            # Real as of 2026-08-15 (platform-cicd-on-kind-dev migration landed - see the doc note
            # above): checks the actual observed status of the cicd-identity-yaml RepositoryFile
            # render-github-resources composed this same pipeline invocation (standard Crossplane
            # managed-resource Ready condition, index [0] since function-go-templating's own
            # ClaimConditions mechanism - same one this step itself uses - doesn't expose a
            # find-by-type helper for reading observed conditions, only setting them). Same
            # redeclare-don't-couple convention applicationenvironment/templates/status/status.yaml
            # already established for extraResources - each pipeline step has its own template
            # execution scope.
            #
            # DevClusterReady (2026-08-18): redeclares the SAME ExtraResources requirement
            # render-github-resources/00-devcluster-gate.yaml already declares in its own,
            # separate pipeline step - this step gets none of that step's variables for free.
            # Surfaces spec.devCluster's live registry validation as its own condition (same
            # "structural backstop, refuse rather than partially succeed" reporting
            # applicationenvironment's ClusterReady condition already established) - when this
            # is False, CicdOnboarded staying False too is expected/correct, not a second bug:
            # nothing in render-github-resources rendered at all (00-devcluster-gate.yaml's own
            # $clusterOk gates cicd-identity-yaml.yaml and secretstore-xr.yaml both).
            <<- $xrName := .observed.composite.resource.metadata.name >>
            <<- $spec := .observed.composite.resource.spec >>
            <<- $devCluster := $spec.devCluster >>
            <<- $allExtra := .extraResources | default dict >>
            <<- $entry := index $allExtra "devcluster-registry-entry" | default dict >>
            <<- $items := index $entry "items" | default list >>
            <<- $clusterOk := false >>
            <<- $clusterType := "" >>
            <<- $cicdReady := "" >>
            <<- if gt (len $items) 0 >>
              <<- $cm := (index $items 0).resource >>
              <<- $clusterType = $cm.data.type >>
              <<- $cicdReady = index $cm.data "cicdReady" | default "" >>
              <<- if and (eq $clusterType "dev") (eq $cicdReady "true") >>
                <<- $clusterOk = true >>
              <<- end >>
            <<- end >>
            <<- $allObserved := .observed.resources | default dict >>
            <<- $identityRes := index $allObserved "cicd-identity-yaml" | default dict >>
            <<- $identityMR := index $identityRes "resource" | default dict >>
            <<- $identityStatus := index $identityMR "status" | default dict >>
            <<- $identityConditions := index $identityStatus "conditions" | default list >>
            <<- $identityReady := false >>
            <<- range $identityConditions >>
              <<- if and (eq .type "Ready") (eq .status "True") >>
                <<- $identityReady = true >>
              <<- end >>
            <<- end >>
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ExtraResources
            requirements:
              devcluster-registry-entry:
                apiVersion: v1
                kind: ConfigMap
                namespace: crossplane-system
                matchName: <<$devCluster>>
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
            <<- if $clusterOk >>
              - type: DevClusterReady
                status: "True"
                reason: DevClusterReady
                message: >-
                  <<$devCluster>> is a registered, cicdReady dev cluster - <<$xrName>> onboards
                  onto it.
                target: CompositeAndClaim
            <<- else >>
              - type: DevClusterReady
                status: "False"
                reason: DevClusterNotReady
                message: >-
                  spec.devCluster (<<$devCluster>>) doesn't resolve to a registered ConfigMap
                  with type: dev and cicdReady: "true" in the cluster registry
                  (gitops-cluster-dev/00-bootstrap/cluster-registry/) - no CICD-onboarding or
                  secrets-infrastructure resources are rendered until it does, rather than
                  partially succeeding against a cluster that may not exist or isn't ready yet.
                target: CompositeAndClaim
            <<- end >>
            <<- if $identityReady >>
              - type: CicdOnboarded
                status: "True"
                reason: CicdOnboarded
                message: >-
                  <<$xrName>>'s tenants/<<$xrName>>/identity.yaml committed to its devCluster's
                  tenants repo - platform-cicd's tenant-onboarding ApplicationSet picks it up on
                  its next poll and stands up the real app-<<$xrName>>-cicd CICD pipeline.
                target: CompositeAndClaim
            <<- else >>
              - type: CicdOnboarded
                status: "False"
                reason: CicdOnboardingPending
                message: >-
                  <<$xrName>>'s src/gitops repos and tenant identity are provisioned, and
                  tenants/<<$xrName>>/identity.yaml has been committed to its devCluster's
                  tenants repo, but that RepositoryFile isn't Ready yet (provider-github still
                  reconciling the commit), or spec.devCluster isn't DevClusterReady yet (see
                  that condition). Resolves itself once it is - no XR edit needed.
                target: CompositeAndClaim
            <<- end >>
            ---
        delims:
          left: "<<"
          right: ">>"
