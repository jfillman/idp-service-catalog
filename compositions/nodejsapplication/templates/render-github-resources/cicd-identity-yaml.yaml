# Commits tenants/<app-name>/identity.yaml into this app's devCluster's own tenants
# repo (today, for kind-dev: gitops-cluster-dev-tenants) - the ONE per-app tenant
# identity file on this cluster (2026-08-18: absorbed app.yaml, which
# used to sit right next to this file with an overlapping-but-not-identical field set -
# see "identity.yaml absorbs app.yaml" below). Read by TWO independent ApplicationSets
# now: platform-cicd's own tenant-onboarding ApplicationSet (charts/
# platform-cicd-control-plane/templates/argocd/tenant-onboarding-applicationset.yaml,
# .Values.tenantsRepoUrl, pointed here via hack/values-kind-dev.yaml) to stand up this
# app's CICD pipeline (Tekton/PaC Application, RBAC, Triggers - see
# platform-cicd/docs/onboarding.md's step 3), and idp's own tenant-appprojects
# ApplicationSet (gitops-cluster-dev/02-argocd-apps/tenant-appprojects/) to build this
# app's AppProject(s) - previously that second consumer read a separate tenants/<app>/
# app.yaml, written by this same step (see git history for that file's own last
# version). This is the real CICD-onboarding-commit step cicd-onboarding-status/
# status.yaml's own header comment named as still-stubbed - built 2026-08-15 once
# platform-cicd's control plane actually landed on kind-dev (see idp/docs/
# service-catalog-design.md's NodeJSApplication note), redirected here from a
# dedicated platform-cicd-kind-dev-tenants repo 2026-08-16 (see $tenantsRepo below).
#
# identity.yaml absorbs app.yaml (2026-08-18): the two files were "almost identical,
# one a subset of the other," sitting side by side in the same commit - but NOT
# byte-for-byte mergeable as-is, because their overlapping gitopsRepoUrl/appRepoUrl
# fields deliberately held DIFFERENT string values. app.yaml's were .git-suffixed
# (matching ArgoCD's own repoURL convention); identity.yaml's never were, because PaC
# matches Repository CR spec.url against GitHub's webhook payload URL with an EXACT
# string compare (pkg/matcher.MatchEventURLRepo, only trims a trailing slash), and that
# payload URL never has .git - a shared .git-suffixed value broke PaC matching for
# every app, confirmed live 2026-08-16 (checkout-api's first real push failed with
# "cannot find a repository match"). Resolved by standardizing on ONE convention,
# system-wide: no .git suffix anywhere (this file's own values were already correct;
# ArgoCD's side is the one that changed - see gitops-cluster-dev's tenant-appprojects
# ApplicationSet for why dropping .git there is safe, ArgoCD normalizes it away when
# matching sourceRepos/repoURL, confirmed live during this same change). The
# pre-existing hand-authored kind-observe identity.yaml (platform-cicd/tenants/
# nodejs-demo-app/identity.yaml) never had .git here either - this restores that
# convention rather than introducing a new one.
#
# $tenantsRepo (2026-08-16, redirected): previously a dedicated
# platform-cicd-kind-dev-tenants repo, eliminated once live history showed it only ever
# held throwaway verification apps and both platform-cicd/docs/onboarding.md and
# idp/README.md confirmed kind-dev's platform-cicd instance is idp-exclusive (unlike
# kind-observe, which hosts real, independent, non-idp tenants and keeps its own
# platform-cicd.git-relative tenants/ - unaffected by this change). Confirmed live no
# AppProject change is needed either: platform-onboarding's sourceRepos already
# wildcards https://github.com/jfillman/*, and tenantsRepoUrl is only ever a generator
# input, never gated by sourceRepos at all.
#
# 2026-08-18: $tenantsRepo/gate now come from 00-devcluster-gate.yaml (same pipeline
# step, persists across this file) instead of a hardcoded "gitops-cluster-dev-tenants"
# literal - this Bootstrap-tier XRD was "permanently centralized on kind-dev" only as
# long as exactly one dev cluster existed; spec.devCluster is now real and required,
# and this resource only renders once that cluster resolves live against the registry
# (type: dev, cicdReady: "true") - see the gate file's own header.
#
# type: app (not infra) - NodeJSApplication only ever provisions regular applications,
# never platform-adjacent services, so this is a fixed literal, not a spec field.
# catalogNamespace: platform-catalog - fixed platform convention, matches every other
# tenant's identity.yaml (platform-cicd/docs/onboarding.md step 3).
#
# All six platformIdentity fields are present even though platform-cicd's own docs allow
# "" for unused ones - gitopsRepoUrl/appRepoUrl are always real here (NodeJSApplication
# always provisions both repos), so there's nothing to leave empty.
<<- $platformOwner := "jfillman" >>
<<- $gitopsRepoUrl := printf "https://github.com/%s/gitops-%s" $platformOwner $xrName >>
<<- $appRepoUrl := printf "https://github.com/%s/%s" $platformOwner $xrName >>
<<- if $clusterOk >>
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  name: <<$xrName>>-cicd-identity-yaml
  annotations:
    <<setResourceNameAnnotation "cicd-identity-yaml">>
spec:
  # managementPolicies excluding "Delete" (matches applicationenvironment's own
  # cluster-identity-yaml.yaml precedent) - landed ahead of the TektonCICD extraction so
  # that removing this composition-resource-name from the pipeline orphans only the k8s
  # RepositoryFile CR, not the real tenants/<app>/identity.yaml file on GitHub. Without
  # this, the extraction would issue a real DELETE against the GitHub API for every
  # already-onboarded app the moment it landed.
  managementPolicies: ["Create", "Update", "Observe", "LateInitialize"]
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    repository: <<$tenantsRepo>>
    file: <<printf "tenants/%s/identity.yaml" $xrName>>
    overwriteOnCreate: true
    content: |
      platformIdentity:
        appName: <<$xrName>>
        type: app
        gitopsRepoUrl: <<$gitopsRepoUrl>>
        appRepoUrl: <<$appRepoUrl>>
        githubOwner: <<$platformOwner>>
        catalogNamespace: platform-catalog
    commitMessage: <<printf "Onboard %s: add tenants/%s/identity.yaml for CICD pipeline onboarding" $xrName $xrName | toJson>>
<<- end >>
