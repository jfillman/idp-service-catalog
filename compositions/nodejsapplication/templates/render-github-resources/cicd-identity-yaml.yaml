# Commits tenants/<app-name>/identity.yaml into gitops-cluster-dev-tenants - read by
# platform-cicd's own tenant-onboarding ApplicationSet (charts/
# platform-cicd-control-plane/templates/argocd/tenant-onboarding-applicationset.yaml,
# .Values.tenantsRepoUrl, pointed here via hack/values-kind-dev.yaml) to actually stand
# up this app's CICD pipeline (Tekton/PaC Application, RBAC, Triggers - see
# platform-cicd/docs/onboarding.md's step 3). This is the real CICD-onboarding-commit
# step cicd-onboarding-status/status.yaml's own header comment named as still-stubbed -
# built 2026-08-15 once platform-cicd's control plane actually landed on kind-dev (see
# idp/docs/service-catalog-design.md's NodeJSApplication note), redirected here from a
# dedicated platform-cicd-kind-dev-tenants repo 2026-08-16 (see $tenantsRepo below).
#
# $platformOwner reused from tenant-app-yaml.yaml in this same step (same platform
# constant). gitopsRepoUrl/appRepoUrl below are deliberately NOT reused from there,
# unlike the original design - both are .git-suffixed in tenant-app-yaml.yaml (matching
# ArgoCD's own repoURL convention, its one confirmed consumer), but platformIdentity's
# copies feed PaC's Repository CR spec.url, matched via an EXACT string compare
# (pkg/matcher.MatchEventURLRepo, only trims a trailing slash) against GitHub's actual
# webhook payload URL - which never has .git. A shared .git-suffixed value here meant
# PaC could never match a real push for ANY app onboarded through this Composition,
# confirmed live 2026-08-16 (checkout-api's first real push failed with "cannot find a
# repository match"). The pre-existing hand-authored kind-observe identity.yaml
# (platform-cicd/tenants/nodejs-demo-app/identity.yaml) never had .git here either -
# this restores that convention rather than introducing a new one.
#
# $tenantsRepo (2026-08-16, redirected): gitops-cluster-dev-tenants - the SAME repo
# tenant-app-yaml.yaml already writes app.yaml into, in this same commit. Previously a
# dedicated platform-cicd-kind-dev-tenants repo, eliminated once live history showed it
# only ever held throwaway verification apps and both platform-cicd/docs/onboarding.md
# and idp/README.md confirmed kind-dev's platform-cicd instance is idp-exclusive (unlike
# kind-observe, which hosts real, independent, non-idp tenants and keeps its own
# platform-cicd.git-relative tenants/ - unaffected by this change). This is a REDIRECT
# only, not a schema merge: the identity.yaml content below and platform-cicd's own
# tenant-onboarding-applicationset.yaml template (shared with kind-observe) are both
# byte-identical to before - only the target repo changed. Confirmed live no AppProject
# change is needed either: platform-onboarding's sourceRepos already wildcards
# https://github.com/jfillman/*, and tenantsRepoUrl is only ever a generator input, never
# gated by sourceRepos at all. This is a Bootstrap-tier XRD, centralized on kind-dev
# permanently (idp_session_multicluster_architecture), so unlike ApplicationEnvironment's
# spec.cluster there's still no per-cluster target to parameterize here.
#
# type: app (not infra) - NodeJSApplication only ever provisions regular applications,
# never platform-adjacent services, so this is a fixed literal, not a spec field.
# catalogNamespace: platform-catalog - fixed platform convention, matches every other
# tenant's identity.yaml (platform-cicd/docs/onboarding.md step 3).
#
# All six platformIdentity fields are present even though platform-cicd's own docs allow
# "" for unused ones - gitopsRepoUrl/appRepoUrl are always real here (NodeJSApplication
# always provisions both repos), so there's nothing to leave empty.
<<- $xrName := .observed.composite.resource.metadata.name >>
<<- $platformOwner := "jfillman" >>
<<- $tenantsRepo := "gitops-cluster-dev-tenants" >>
<<- $gitopsRepoUrl := printf "https://github.com/%s/gitops-%s" $platformOwner $xrName >>
<<- $appRepoUrl := printf "https://github.com/%s/%s" $platformOwner $xrName >>
apiVersion: repo.github.m.upbound.io/v1alpha1
kind: RepositoryFile
metadata:
  name: <<$xrName>>-cicd-identity-yaml
  annotations:
    <<setResourceNameAnnotation "cicd-identity-yaml">>
spec:
  providerConfigRef:
    kind: ClusterProviderConfig
    name: default
  forProvider:
    repository: <<$tenantsRepo>>
    file: <<printf "tenants/%s/identity.yaml" $xrName>>
    overwriteOnCreate: true
    content: |
      platformIdentity:
        appName: <<$xrName>>
        type: app
        gitopsRepoUrl: <<$gitopsRepoUrl>>
        appRepoUrl: <<$appRepoUrl>>
        githubOwner: <<$platformOwner>>
        catalogNamespace: platform-catalog
    commitMessage: <<printf "Onboard %s: add tenants/%s/identity.yaml for CICD pipeline onboarding" $xrName $xrName | toJson>>
