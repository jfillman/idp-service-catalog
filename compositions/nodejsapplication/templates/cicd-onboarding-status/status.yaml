# Surfaces the CICD-onboarding status as a custom condition, not an override of the
# standard Ready condition - see xrds/nodejsapplication.yaml's own header and
# idp/docs/service-catalog-design.md Item 1/2's "real known gap" note for what this was
# and why. Ready itself stays real (whatever detect-ready, the pipeline step before this
# one, computes from the actual provider-github managed resources): function-go-
# templating's own docs (github.com/crossplane-contrib/function-go-templating,
# "Setting Conditions on the Claim and Composite") explicitly reserve
# Ready/Healthy/Synced and error if a Composition tries to set them directly via its
# ClaimConditions mechanism - confirmed live, not guessed, after an earlier attempt at
# patching status.conditions directly (matching the XR's own apiVersion/kind, no
# composition-resource-name annotation - a real, but different, documented mechanism for
# a different purpose) rendered with zero effect via crossplane render.
#
# Real as of 2026-08-15 (platform-cicd-on-kind-dev migration landed - see the doc note
# above): checks the actual observed status of the cicd-identity-yaml RepositoryFile
# render-github-resources composed this same pipeline invocation (standard Crossplane
# managed-resource Ready condition, index [0] since function-go-templating's own
# ClaimConditions mechanism - same one this step itself uses - doesn't expose a
# find-by-type helper for reading observed conditions, only setting them). Same
# redeclare-don't-couple convention applicationenvironment/templates/status/status.yaml
# already established for extraResources - each pipeline step has its own template
# execution scope.
#
# DevClusterReady (2026-08-18): redeclares the SAME ExtraResources requirement
# render-github-resources/00-devcluster-gate.yaml already declares in its own,
# separate pipeline step - this step gets none of that step's variables for free.
# Surfaces spec.devCluster's live registry validation as its own condition (same
# "structural backstop, refuse rather than partially succeed" reporting
# applicationenvironment's ClusterReady condition already established) - when this
# is False, CicdOnboarded staying False too is expected/correct, not a second bug:
# nothing in render-github-resources rendered at all (00-devcluster-gate.yaml's own
# $clusterOk gates cicd-identity-yaml.yaml and secretstore-xr.yaml both).
<<- $xrName := .observed.composite.resource.metadata.name >>
<<- $spec := .observed.composite.resource.spec >>
<<- $devCluster := $spec.devCluster >>
<<- $allExtra := .extraResources | default dict >>
<<- $entry := index $allExtra "devcluster-registry-entry" | default dict >>
<<- $items := index $entry "items" | default list >>
<<- $clusterOk := false >>
<<- $clusterType := "" >>
<<- $cicdReady := "" >>
<<- if gt (len $items) 0 >>
  <<- $cm := (index $items 0).resource >>
  <<- $clusterType = $cm.data.type >>
  <<- $cicdReady = index $cm.data "cicdReady" | default "" >>
  <<- if and (eq $clusterType "dev") (eq $cicdReady "true") >>
    <<- $clusterOk = true >>
  <<- end >>
<<- end >>
<<- $allObserved := .observed.resources | default dict >>
<<- $identityRes := index $allObserved "cicd-identity-yaml" | default dict >>
<<- $identityMR := index $identityRes "resource" | default dict >>
<<- $identityStatus := index $identityMR "status" | default dict >>
<<- $identityConditions := index $identityStatus "conditions" | default list >>
<<- $identityReady := false >>
<<- range $identityConditions >>
  <<- if and (eq .type "Ready") (eq .status "True") >>
    <<- $identityReady = true >>
  <<- end >>
<<- end >>
apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
kind: ExtraResources
requirements:
  devcluster-registry-entry:
    apiVersion: v1
    kind: ConfigMap
    namespace: crossplane-system
    matchName: <<$devCluster>>
---
apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
kind: ClaimConditions
conditions:
<<- if $clusterOk >>
  - type: DevClusterReady
    status: "True"
    reason: DevClusterReady
    message: >-
      <<$devCluster>> is a registered, cicdReady dev cluster - <<$xrName>> onboards
      onto it.
    target: CompositeAndClaim
<<- else >>
  - type: DevClusterReady
    status: "False"
    reason: DevClusterNotReady
    message: >-
      spec.devCluster (<<$devCluster>>) doesn't resolve to a registered ConfigMap
      with type: dev and cicdReady: "true" in the cluster registry
      (gitops-cluster-dev/00-bootstrap/cluster-registry/) - no CICD-onboarding or
      secrets-infrastructure resources are rendered until it does, rather than
      partially succeeding against a cluster that may not exist or isn't ready yet.
    target: CompositeAndClaim
<<- end >>
<<- if $identityReady >>
  - type: CicdOnboarded
    status: "True"
    reason: CicdOnboarded
    message: >-
      <<$xrName>>'s tenants/<<$xrName>>/identity.yaml committed to its devCluster's
      tenants repo - platform-cicd's tenant-onboarding ApplicationSet picks it up on
      its next poll and stands up the real app-<<$xrName>>-cicd CICD pipeline.
    target: CompositeAndClaim
<<- else >>
  - type: CicdOnboarded
    status: "False"
    reason: CicdOnboardingPending
    message: >-
      <<$xrName>>'s src/gitops repos and tenant identity are provisioned, and
      tenants/<<$xrName>>/identity.yaml has been committed to its devCluster's
      tenants repo, but that RepositoryFile isn't Ready yet (provider-github still
      reconciling the commit), or spec.devCluster isn't DevClusterReady yet (see
      that condition). Resolves itself once it is - no XR edit needed.
    target: CompositeAndClaim
<<- end >>
