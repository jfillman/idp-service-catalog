# Proxies DevClusterReady/CicdOnboarded straight from the composed TektonCICD
# child's own status.conditions onto this XR's status - both conditions are now
# computed entirely inside compositions/tektoncicd's own Composition (see
# xrds/tektoncicd.yaml's own header for why CI/CD onboarding was extracted there),
# this step just re-surfaces them here so `kubectl describe nodejsapplication/<app>`
# still shows both directly on the app, same UX as before the extraction.
#
# Same read-the-observed-resource-map mechanism this step used pre-extraction to
# read the raw cicd-identity-yaml RepositoryFile's own Ready condition - just
# retargeted one level: "tektoncicd" (setResourceNameAnnotation in
# render-github-resources/tekton-cicd-child.yaml) instead of "cicd-identity-yaml".
# function-go-templating's ClaimConditions mechanism has no find-by-type helper for
# reading observed conditions, only setting them, so this is a plain range/match,
# same as every other status-proxy step in this catalog.
#
# BOTH conditions need this treatment, not just CicdOnboarded - DevClusterReady
# would otherwise silently disappear from this XR's own status.
<<- $xrName := .observed.composite.resource.metadata.name >>
<<- $allObserved := .observed.resources | default dict >>
<<- $childRes := index $allObserved "tektoncicd" | default dict >>
<<- $childXR := index $childRes "resource" | default dict >>
<<- $childStatus := index $childXR "status" | default dict >>
<<- $childConditions := index $childStatus "conditions" | default list >>
<<- $devClusterCondition := dict >>
<<- $cicdOnboardedCondition := dict >>
<<- range $childConditions >>
  <<- if eq .type "DevClusterReady" >>
    <<- $devClusterCondition = . >>
  <<- else if eq .type "CicdOnboarded" >>
    <<- $cicdOnboardedCondition = . >>
  <<- end >>
<<- end >>
apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
kind: ClaimConditions
conditions:
<<- if $devClusterCondition >>
  - type: DevClusterReady
    status: <<$devClusterCondition.status | toJson>>
    reason: <<$devClusterCondition.reason>>
    message: <<$devClusterCondition.message | toJson>>
    target: CompositeAndClaim
<<- else >>
  - type: DevClusterReady
    status: "False"
    reason: DevClusterNotReady
    message: >-
      Waiting on the composed TektonCICD child (<<$xrName>>-tektoncicd) to report
      its own DevClusterReady condition - resolves itself once it does.
    target: CompositeAndClaim
<<- end >>
<<- if $cicdOnboardedCondition >>
  - type: CicdOnboarded
    status: <<$cicdOnboardedCondition.status | toJson>>
    reason: <<$cicdOnboardedCondition.reason>>
    message: <<$cicdOnboardedCondition.message | toJson>>
    target: CompositeAndClaim
<<- else >>
  - type: CicdOnboarded
    status: "False"
    reason: CicdOnboardingPending
    message: >-
      Waiting on the composed TektonCICD child (<<$xrName>>-tektoncicd) to report
      its own CicdOnboarded condition - resolves itself once it does.
    target: CompositeAndClaim
<<- end >>
