name: infisical-secretstore-operator-ci

# Closes the "no CI publish pipeline" gap flagged in this operator's own README
# (operators/infisical-secretstore-operator/README.md's "Known gaps" section) - until
# 2026-08-26 a new build meant a manual `podman build && podman push` from whoever
# made the change, easy to forget and impossible to enforce. Every push to main that
# touches this operator's source now builds and pushes automatically.
#
# Publishes to `:dev` (mutable - every cluster's deployment.yaml already pins this
# tag with imagePullPolicy: IfNotPresent, see gitops-cluster-dev/gitops-cluster-
# kind-prod/gitops-cluster-kind-man's own copies) AND `:<shortsha>` (immutable, for
# traceability/rollback - not yet wired to anything, no cluster deployment.yaml
# references a sha tag). Does NOT update any cluster's deployment.yaml itself - each
# cluster still needs a manual `rollout restart` (or a pod delete, if the node's
# already caching the old `:dev` layer) to actually pick up a new push, same
# operational gap the operator's own README's "Local dev loop" section documents.
# A real promote-to-cluster mechanism (ArgoCD Image Updater or similar) is future
# work, not built here.
#
# linux/arm64 only (2026-09-01): every cluster this operator runs on is now arm64 -
# the kind-dev/kind-prod/kind-man Docker Desktop VMs (Apple Silicon host, Rosetta-
# emulated amd64 previously worked there but arm64 is native and faster) and the new
# kiac-dev cluster (Apple's native `container` runtime, which has NO x86 emulation -
# an amd64 image just fails to run there, this is what broke). Built cross-arch via
# buildx+QEMU since the ubuntu-latest runner itself is amd64.

on:
  push:
    branches: [main]
    paths:
      - "operators/infisical-secretstore-operator/**"
      - ".github/workflows/infisical-secretstore-operator-ci.yaml"
  pull_request:
    paths:
      - "operators/infisical-secretstore-operator/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Syntax-check main.py (no test suite exists yet for this operator)
        run: python -m py_compile operators/infisical-secretstore-operator/main.py

  publish:
    runs-on: ubuntu-latest
    needs: [lint]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short sha
        id: vars
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push image (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: operators/infisical-secretstore-operator
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/jfillman/infisical-secretstore-operator:dev
            ghcr.io/jfillman/infisical-secretstore-operator:${{ steps.vars.outputs.short_sha }}
