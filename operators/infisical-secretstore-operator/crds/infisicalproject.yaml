# InfisicalProject - the CRD this operator reconciles. One per (app, cluster) pair,
# per service-catalog-design.md Item 8's scope decision - created by the SecretStore
# XRD's Composition (idp-service-catalog/compositions/secretstore/), never directly by
# a developer.
#
# Namespaced (not cluster-scoped) - matches every other XR/composed-resource
# convention already established in this catalog (ApplicationEnvironment,
# NodeJSApplication are all namespaced). The credentials Secret this operator writes
# lands in the same namespace as the InfisicalProject CR itself.
#
# Why a plain CRD + operator instead of a Crossplane provider/Composition Function -
# see service-catalog-design.md Item 8's "Q1" discussion: a Composition Function is a
# stateless render pass with no delete-lifecycle hook, wrong layer for something with
# a real external CRUD lifecycle. This is deliberately a THIN, purpose-built
# controller (kopf/Python, matching this project's existing convention for
# function-rollout-watcher-style controllers) - not a general-purpose Infisical
# provider, just enough surface for what the SecretStore XRD needs.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: infisicalprojects.secrets.idp.io
spec:
  group: secrets.idp.io
  scope: Namespaced
  names:
    kind: InfisicalProject
    plural: infisicalprojects
    singular: infisicalproject
    shortNames: ["ip"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Project
          type: string
          jsonPath: .status.projectSlug
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [projectName, authMethod]
              properties:
                projectName:
                  type: string
                  maxLength: 64
                  description: >-
                    Infisical project display name. Also the fallback source for its
                    slug (slugified) if `slug` below is omitted - but the SecretStore
                    XRD's Composition always sets `slug` explicitly, to its own XR
                    name, so the two can't independently drift apart.
                slug:
                  type: string
                  maxLength: 64
                  pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
                  description: >-
                    Explicit Infisical project slug. When set, takes priority over
                    slugifying projectName - the SecretStore XRD's Composition always
                    sets this, to its own XR name (already DNS-1123-safe by this
                    catalog's naming convention), so the Composition's rendered
                    ClusterSecretStore can reference the same deterministic slug
                    directly with no live lookup back to this resource's status.
                environmentSlug:
                  type: string
                  default: shared
                  description: >-
                    The single Infisical environment created for this project. Real
                    per-env (dev/staging/prod) separation happens via secretsPath
                    folders inside this one environment, not via separate Infisical
                    environments - ESO's own `infisical` SecretStore provider pins
                    exactly one environmentSlug per ClusterSecretStore
                    (spec.provider.infisical.secretsScope.environmentSlug), so sharing
                    one store across an app's dev/staging/prod envs on the same
                    cluster only works if they all live under one Infisical
                    environment, split by path instead - confirmed against ESO's
                    real CRD schema (external-secrets/application.yaml's own vendored
                    reference), not assumed.
                credentialsSecretName:
                  type: string
                  description: >-
                    Name of the Kubernetes Secret this operator creates (in this
                    InfisicalProject's own namespace) holding this identity's
                    credentials - shape depends on authMethod (identityId only for
                    kubernetes, clientId+clientSecret for universal).
                authMethod:
                  type: string
                  enum: ["kubernetes", "universal"]
                  description: >-
                    How this identity authenticates - set by the SecretStore XRD's
                    Composition from a cluster-registry lookup (kind-dev ->
                    kubernetes, every upper cluster -> universal), never a
                    developer-facing choice. kubernetes: zero-persisted-credential,
                    verified live against this cluster's own TokenReview API - only
                    possible because Infisical and the workload are always on the
                    SAME cluster there. universal: a real, persisted
                    clientId/clientSecret - required for upper clusters, since
                    Infisical (kind-dev only) can't call TokenReview against a
                    DIFFERENT cluster's API without Gateway mode (Enterprise-only).
                    See idp/docs/service-catalog-design.md Item 8's multi-cluster
                    revision for the full tradeoff.
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Ready", "Failed"]
                message:
                  type: string
                projectId:
                  type: string
                projectSlug:
                  type: string
                environmentSlug:
                  type: string
                identityId:
                  type: string
                credentialsSecretName:
                  type: string
                authMethod:
                  type: string
                # Standard Crossplane condition shape - required for the SecretStore
                # Composition's function-auto-ready pipeline step to see this resource
                # as ready. Without this, the composite XR stays "Creating" forever
                # even after this operator's own reconcile succeeds (status.phase
                # alone means nothing to function-auto-ready, which only ever checks
                # status.conditions[type=Ready].status=="True" - confirmed live,
                # kind-dev's checkout-api-kind-dev SecretStore stuck at Ready:False
                # with phase: Ready underneath the whole time).
                conditions:
                  type: array
                  items:
                    type: object
                    required: [type, status]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
