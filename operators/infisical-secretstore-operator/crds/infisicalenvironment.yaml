# InfisicalEnvironment - a second, deliberately thin CRD alongside InfisicalProject,
# reconciled by the SAME operator (main.py). Ensures ONE additional environment
# exists inside an ALREADY-existing Infisical project - never creates a project or an
# identity itself (that's InfisicalProject's job, elsewhere). Exists because
# idp/docs/service-catalog-design.md Item 8's multi-cluster revision (Option 2) needs
# N environments per project - one per ApplicationEnvironment on an upper cluster,
# alongside the one "shared" environment InfisicalProject itself already manages -
# and ESO's ClusterSecretStore pins exactly one environmentSlug per store, so real
# per-env isolation needs a real per-env Infisical environment, not just a
# secretsPath convention.
#
# Rendered by idp-service-catalog's idp-application chart
# (charts/idp-application/templates/attached/secretstore.yaml), one per
# ApplicationEnvironment release on an upper cluster - never developer-authored.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: infisicalenvironments.secrets.idp.io
spec:
  group: secrets.idp.io
  scope: Namespaced
  names:
    kind: InfisicalEnvironment
    plural: infisicalenvironments
    singular: infisicalenvironment
    shortNames: ["ie"]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Project
          type: string
          jsonPath: .spec.projectSlug
        - name: Environment
          type: string
          jsonPath: .spec.environmentSlug
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [projectSlug, environmentSlug]
              properties:
                projectSlug:
                  type: string
                  maxLength: 64
                  description: >-
                    Slug of an already-existing Infisical project - the SAME value an
                    InfisicalProject CR for this (app, cluster) pair already used as
                    its own spec.slug. This CR never creates or looks up the project
                    by any other means; if it doesn't exist yet, reconcile waits
                    (TemporaryError), it does not create one.
                environmentSlug:
                  type: string
                  maxLength: 64
                  pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'
                  description: >-
                    The environment to ensure exists inside that project - the real
                    k8s ApplicationEnvironment's own env name, so a ClusterSecretStore
                    pinned to this environmentSlug can be scoped 1:1 to the matching
                    k8s namespace.
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: ["Pending", "Ready", "Failed"]
                message:
                  type: string
                projectId:
                  type: string
                environmentId:
                  type: string
