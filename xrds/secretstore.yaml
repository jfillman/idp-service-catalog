# Third Bootstrap-tier-adjacent XRD - idp/docs/service-catalog-design.md Item 8.
# One per (app, cluster) pair - NOT per (app, cluster, env) - shared across that
# app's envs on the same cluster, never across clusters (a ClusterSecretStore is
# always local to one cluster's API, so that's the structural ceiling regardless of
# policy).
#
# STANDALONE-CREATABLE for this first pass, same as SLO's own XRD - NOT YET
# auto-provisioned by the first ApplicationEnvironment for a given (app,cluster) pair
# the way Item 8's full design calls for. That wiring is real, separate follow-up
# work (needs the idempotent-git-file-write mechanism discussed for exactly this
# "N sibling XRs, one shared resource" problem, reusing values-yaml.yaml's own
# RepositoryFile pattern - see idp-service-catalog's own commit history / the
# session that built this XRD for the full reasoning) - deliberately not bolted on
# here. Create one of these by hand (or via Backstage once wired) per (app, cluster)
# for now, same as SLO/Redis/OAuthServer are today.
#
# apiextensions.crossplane.io/v2 (not v1), same as every other XRD in this catalog.
#
# Naming convention (not CEL-enforced, matching every other XRD's precedent of not
# enforcing any naming relationship between an XR and what it creates, but STRUCTURAL
# here in a way SLO's convention isn't): name this XR <appName>-<cluster>. The
# Composition uses this XR's own metadata.name directly as both the Infisical
# project's slug and the ClusterSecretStore's name - not a coincidence, a
# deliberate simplification (see compositions/secretstore/templates/ - no
# ExtraResources lookup needed anywhere in this Composition because every
# downstream identifier is this XR's own name, known from the first reconcile).
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: secretstores.catalog.idp.io
spec:
  group: catalog.idp.io
  names:
    kind: SecretStore
    plural: secretstores
    singular: secretstore
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - appRef
                - cluster
              properties:
                appRef:
                  type: object
                  description: >-
                    Names the owning NodeJSApplication/SpringBootApplication XR this
                    store belongs to. Labeling/audit only - not a live lookup, same
                    convention as every other Attached-tier XRD's environmentRef in
                    this catalog. Deliberately NOT named environmentRef like every
                    other Attached-tier resource - this store explicitly must not pin
                    to one env, item 8's whole point.
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                cluster:
                  type: string
                  description: >-
                    Which cluster's Infisical instance + ESO this store targets - no
                    live cluster-registry gate here (unlike ApplicationEnvironment),
                    since this XRD's Composition makes no cross-cluster call, only
                    local ones (this cluster's own Infisical + this cluster's own
                    ESO).
                  minLength: 1
                environmentSlug:
                  type: string
                  default: shared
                  description: >-
                    The single Infisical environment this store's project uses - see
                    InfisicalProject's own CRD for why one, not Infisical's default
                    three. Only ever worth changing from the default for a second
                    SecretStore test fixture in the same project; real apps should
                    leave this alone.
              required: ["appRef", "cluster"]
          required: ["spec"]
