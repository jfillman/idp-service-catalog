# Third Bootstrap-tier-adjacent XRD - idp/docs/service-catalog-design.md Item 8.
# TWO real modes now, both driven by environmentSlug (see that field's own
# description) - not two XRDs, since they share every other field and most of the
# Composition's own logic (project-slug derivation, cluster-based auth-method
# selection):
#   - environmentSlug: "shared" (the default) - the ORIGINAL mode. Creates the
#     Infisical project + identity + "shared" environment + a wide-open
#     ClusterSecretStore for this (app, cluster) pair.
#   - environmentSlug: anything else - the NEW, Item-8-multi-cluster-revision mode.
#     Does NOT create a project or identity - the project (see above) MUST already
#     exist. Creates one additional Infisical environment inside that ALREADY-
#     existing project, plus a SEPARATE ClusterSecretStore narrowed to exactly the
#     matching k8s namespace (app-<appName>-<environmentSlug>) - real per-env
#     isolation, not a secretsPath convention. One per ApplicationEnvironment on an
#     upper cluster.
#
# AUTO-PROVISIONED, not standalone-creatable, never developer-authored directly -
# but NOT via idp-application's chart (a real correction, same day): that always-on
# chart template meant secrets infrastructure was an emergent side effect of
# "someone happened to ship a real release" - a real complaint, not just a style
# preference. Now created directly by the Bootstrap XRs that already exist for
# every app: NodeJSApplication commits the "shared"-mode manifest into
# tenants/<app>/xr-requests/secretstore.yaml on kind-dev (compositions/
# nodejsapplication/templates/render-github-resources/secretstore-xr.yaml);
# ApplicationEnvironment commits BOTH the "shared"-mode manifest (redundant-but-
# harmless idempotent writes, same convention as its own cluster-identity-yaml.yaml) and
# its own per-environment one into tenants/<app>/xr-requests/ on the TARGET cluster's
# own tenants repo (compositions/applicationenvironment/templates/
# render-github-resources/secretstore-xrs.yaml). Both go through xr-requests - the
# SAME mechanism every other Bootstrap XR already uses - so this exists the moment
# onboarding/env-creation reconciles, git-commit-speed, no Helm release required.
# Every upper cluster needs its own xr-requests ApplicationSet+AppProject for this
# (kind-prod's: gitops-cluster-kind-prod/02-argocd-apps/xr-requests/) - didn't exist
# before, since Bootstrap XRs never ran on upper clusters until this.
#
# apiextensions.crossplane.io/v2 (not v1), same as every other XRD in this catalog.
#
# Naming convention (not CEL-enforced, matching every other XRD's precedent, but
# STRUCTURAL here): name a "shared"-mode XR <appName>-<cluster>; name a per-env XR
# <appName>-<cluster>-<environmentSlug> (has to differ - two XRs can't share one
# name). The Infisical project slug itself is NOT derived from either XR's own name
# any more (a deliberate change from this XRD's first pass) - it's computed
# identically in both modes as <appRef.name>-<cluster>, so a per-env XR can compute
# the SAME project slug its sibling "shared" XR already created without any
# ExtraResources lookup.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: secretstores.catalog.idp.io
spec:
  group: catalog.idp.io
  names:
    kind: SecretStore
    plural: secretstores
    singular: secretstore
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - appRef
                - cluster
              properties:
                appRef:
                  type: object
                  description: >-
                    Names the owning NodeJSApplication/SpringBootApplication XR this
                    store belongs to. Labeling/audit only - not a live lookup, same
                    convention as every other Attached-tier XRD's environmentRef in
                    this catalog. Deliberately NOT named environmentRef like every
                    other Attached-tier resource - this store explicitly must not pin
                    to one env, item 8's whole point.
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                cluster:
                  type: string
                  description: >-
                    Which cluster's Infisical instance + ESO this store targets - no
                    live cluster-registry gate here (unlike ApplicationEnvironment),
                    since this XRD's Composition makes no cross-cluster call, only
                    local ones (this cluster's own Infisical + this cluster's own
                    ESO).
                  minLength: 1
                environmentSlug:
                  type: string
                  default: shared
                  description: >-
                    "shared" (the default): this XR creates the project/identity/
                    ClusterSecretStore for this (app, cluster) pair, with one
                    Infisical environment named "shared", wide-open across every env
                    namespace. Any OTHER value: this XR does NOT create a project - it
                    adds one more Infisical environment (this value) to the
                    ALREADY-existing project from the "shared" XR, plus a second
                    ClusterSecretStore narrowed to exactly one k8s namespace
                    (app-<appRef.name>-<environmentSlug>). Real per-env isolation -
                    see xrds/secretstore.yaml's own header for the full mechanism.
              required: ["appRef", "cluster"]
          required: ["spec"]
