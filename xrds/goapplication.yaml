# Fourth Bootstrap-tier stack XRD - structural port of NodeJSApplication, same as
# SpringBootApplication/PythonApplication were. CI/CD onboarding is composed from
# the shared TektonCICD XRD (see compositions/goapplication/templates/
# render-github-resources/tekton-cicd-child.yaml), same as PythonApplication.
#
# XR's own metadata.name IS the app name (no separate spec.appName) - matches every
# other app XRD's own convention.
#
# No spec.githubOwner - same reasoning as every other app XRD's header.
#
# No package-manager-equivalent field: Go has one real toolchain (go modules), unlike
# Node/Python's several - nothing to branch on, so unlike those two this XRD doesn't
# carry one. No spec.modulePath either - the module path is derivable the same way
# appRepoUrl already is (github.com/jfillman/<xrName>, matching the real repo URL,
# the Go-conventional choice for a module path), computed as a template literal in
# src-repo.yaml, not taken as input - same "platform computes it, not each app"
# reasoning SpringBootApplication's own header gives for omitting springBootVersion.
apiVersion: apiextensions.crossplane.io/v2
kind: CompositeResourceDefinition
metadata:
  name: goapplications.catalog.idp.io
  annotations:
    terasky.backstage.io/add-to-catalog: "true"
    terasky.backstage.io/target-path: "tenants/${{ parameters.xrName }}/xr-requests/goapplication.yaml"
spec:
  group: catalog.idp.io
  names:
    kind: GoApplication
    plural: goapplications
    singular: goapplication
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                devCluster:
                  type: string
                  description: >-
                    Which dev cluster this app is onboarded onto - e.g. "kind-dev".
                    An app is pinned to exactly one. Checked live against the
                    cluster registry (gitops-cluster-dev/00-bootstrap/
                    cluster-registry/) via a Crossplane extra-resources lookup:
                    must resolve to a ConfigMap with type: dev and
                    cicdReady: "true", or the Composition creates nothing and
                    reports DevClusterReady: False rather than partially
                    succeeding - see this XRD's own header comment.
                  minLength: 1
                description:
                  type: string
                  description: >-
                    Free-text description - used as the src repo's GitHub description
                    and in the generated boilerplate README. Optional; omitted sections
                    render a generic placeholder instead.
                  minLength: 1
                goVersion:
                  type: string
                  description: >-
                    Go minor version - drives the Dockerfile's build-stage FROM line
                    and go.mod's own go directive. One of this platform's
                    currently-supported lines, not a free-form string, so a typo
                    fails XR admission instead of producing a Dockerfile that pulls
                    a nonexistent image tag.
                  enum: ["1.22", "1.23", "1.24"]
                  default: "1.23"
                port:
                  type: integer
                  description: >-
                    Port the boilerplate HTTP server listens on (also the
                    Dockerfile's EXPOSE). Matches idp-application's own
                    rollout.ports default convention.
                  minimum: 1
                  maximum: 65535
                  default: 8080
                visibility:
                  type: string
                  description: GitHub visibility for both the src and gitops repos.
                  enum: [private, public]
                  default: private
              required: ["devCluster"]
          required: ["spec"]
